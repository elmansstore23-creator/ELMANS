<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Luxury Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --black:#030303;
    --black2:#080808;
    --card:#101010;
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --white:#f8f8f8;
    --gray:#888;
    --danger:#c94b4b;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(212,175,55,.10),transparent 35%),
        var(--black);
    color:var(--white);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:rgba(3,3,3,.92);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(212,175,55,.18);
}

.logo{
    direction:ltr;
    font-family:Georgia,serif;
    font-size:27px;
    font-weight:bold;
    letter-spacing:5px;
}

.logo span{
    color:var(--gold);
}

.admin-label{
    color:#777;
    font-size:11px;
    letter-spacing:2px;
}

/* =========================
   MAIN
========================= */

.container{
    width:92%;
    max-width:1200px;
    margin:45px auto 80px;
}

.hero-title{
    text-align:center;
    margin-bottom:40px;
}

.hero-title small{
    color:var(--gold);
    letter-spacing:6px;
    font-size:10px;
}

.hero-title h1{
    font-family:Georgia,serif;
    font-size:clamp(38px,6vw,65px);
    margin:10px 0;
}

.hero-title h1 span{
    color:var(--gold);
}

.hero-title p{
    color:#666;
    font-size:12px;
}

/* =========================
   CARD
========================= */

.card{
    background:
        linear-gradient(145deg,rgba(255,255,255,.025),transparent),
        var(--card);

    border:1px solid rgba(212,175,55,.18);
    padding:30px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.35);
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.card-title h2{
    color:var(--gold);
    font-family:Georgia,serif;
    font-size:25px;
}

.card-title small{
    color:#666;
    font-size:11px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}

.form-group{
    margin-bottom:4px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:14px;

    background:#050505;
    color:white;

    border:1px solid rgba(212,175,55,.16);
    outline:none;

    font-size:13px;
    border-radius:2px;
    transition:.25s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(212,175,55,.05);
}

textarea{
    min-height:105px;
    resize:vertical;
}

/* =========================
   IMAGE
========================= */

.image-box{
    display:flex;
    gap:20px;
    align-items:center;
}

.image-preview{
    width:115px;
    height:115px;
    object-fit:cover;

    display:none;

    border:1px solid var(--gold);
    background:#050505;
}

.file-input{
    flex:1;
}

/* =========================
   BUTTONS
========================= */

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.primary-btn{
    flex:1;
    padding:15px;

    border:1px solid var(--gold);
    background:var(--gold);
    color:#000;

    font-weight:bold;
    font-size:14px;

    transition:.3s;
}

.primary-btn:hover{
    background:var(--gold2);
    transform:translateY(-2px);
}

.secondary-btn{
    padding:15px 25px;

    border:1px solid rgba(212,175,55,.3);
    background:transparent;
    color:#aaa;

    font-weight:bold;
}

.secondary-btn:hover{
    color:white;
    border-color:var(--gold);
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    margin-top:18px;
    padding:13px;

    text-align:center;
    font-size:12px;
}

.status.success{
    display:block;
    background:#0d1d0d;
    color:#73d073;
    border:1px solid #275d27;
}

.status.error{
    display:block;
    background:#200d0d;
    color:#ff7777;
    border:1px solid #662828;
}

/* =========================
   PRODUCTS HEADER
========================= */

.products-section{
    margin-top:35px;
}

.products-header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
}

.products-header h2{
    font-family:Georgia,serif;
    font-size:27px;
}

.products-header h2 span{
    color:var(--gold);
}

.search-box{
    width:280px;
}

.search-box input{
    padding:11px 14px;
}

/* =========================
   PRODUCTS
========================= */

.products-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.product-row{
    display:flex;
    gap:15px;
    align-items:center;

    padding:15px;

    background:#0d0d0d;
    border:1px solid rgba(212,175,55,.12);

    transition:.3s;
}

.product-row:hover{
    border-color:rgba(212,175,55,.45);
    transform:translateY(-2px);
}

.product-row img{
    width:90px;
    height:90px;

    object-fit:cover;

    background:#050505;
    border:1px solid rgba(212,175,55,.18);
}

.product-info{
    flex:1;
    min-width:0;
}

.product-info strong{
    display:block;
    font-size:14px;
    margin-bottom:7px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-info small{
    display:block;
    color:var(--gold);
    margin-bottom:5px;
}

.product-info .category-text{
    color:#666;
    font-size:10px;
}

.product-actions{
    display:flex;
    flex-direction:column;
    gap:7px;
    width:85px;
}

.edit-btn,
.delete-btn{
    width:100%;
    padding:9px 5px;
    font-size:10px;
    font-weight:bold;
}

.edit-btn{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
}

.edit-btn:hover{
    background:var(--gold);
    color:#000;
}

.delete-btn{
    border:1px solid rgba(201,75,75,.5);
    background:transparent;
    color:#e07070;
}

.delete-btn:hover{
    background:var(--danger);
    color:white;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    text-align:center;
    padding:60px 20px;

    background:#090909;
    border:1px dashed rgba(212,175,55,.18);
}

.empty .icon{
    color:var(--gold);
    font-size:35px;
    margin-bottom:10px;
}

.empty strong{
    display:block;
    font-size:17px;
}

.empty p{
    color:#666;
    font-size:11px;
    margin-top:7px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.88);

    opacity:0;
    visibility:hidden;

    transition:.3s;
}

.modal.open{
    opacity:1;
    visibility:visible;
}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;

    background:#0a0a0a;
    border:1px solid rgba(212,175,55,.3);

    padding:28px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;
}

.modal-header h2{
    color:var(--gold);
    font-family:Georgia,serif;
}

.close-btn{
    width:38px;
    height:38px;

    border-radius:50%;

    background:transparent;
    color:white;

    border:1px solid rgba(212,175,55,.25);

    font-size:22px;
}

.close-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
}

/* =========================
   CONFIRM
========================= */

.confirm-box{
    width:min(420px,100%);
    background:#0a0a0a;
    border:1px solid rgba(212,175,55,.25);
    padding:30px;
    text-align:center;
}

.confirm-box h3{
    margin-bottom:10px;
}

.confirm-box p{
    color:#777;
    font-size:12px;
    line-height:2;
}

.confirm-buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.confirm-delete{
    flex:1;
    padding:13px;
    background:var(--danger);
    border:0;
    color:white;
    font-weight:bold;
}

.confirm-cancel{
    flex:1;
    padding:13px;
    background:transparent;
    border:1px solid rgba(212,175,55,.25);
    color:#aaa;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .products-list{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){

    .container{
        width:94%;
        margin-top:30px;
    }

    .card{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .products-header{
        flex-direction:column;
        align-items:stretch;
    }

    .search-box{
        width:100%;
    }

    .product-row{
        align-items:flex-start;
    }

    .product-row img{
        width:75px;
        height:75px;
    }

    .product-actions{
        width:70px;
    }

    .form-buttons{
        flex-direction:column;
    }

    .secondary-btn{
        width:100%;
    }
}
</style>
</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let products = [];

let editingProductId = null;

let deletingProductId = null;


/* =========================================
   CATEGORY NAMES
========================================= */

const categoryNames = {

    "men-accessories":"اكسسوارات رجالي",
    "women-accessories":"اكسسوارات حريمي",
    "men-chains":"سلاسل رجالي",
    "women-chains":"سلاسل حريمي",
    "gifts":"هدايا",
    "teddy":"دباديب",
    "men-perfume":"برفانات رجالي",
    "women-perfume":"برفانات حريمي",
    "men-body-splash":"بادي سبلاش رجالي",
    "women-body-splash":"بادي سبلاش حريمي",
    "parties":"حفلات",
    "watches":"ساعات",
    "engagement":"دبل خطوبة"

};


/* =========================================
   IMAGE PREVIEW
========================================= */

document
    .getElementById("imageFile")
    .addEventListener("change",function(){

        const file =
            this.files[0];

        const preview =
            document.getElementById("preview");

        if(!file){

            preview.style.display =
                "none";

            preview.src =
                "";

            return;
        }

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";

    });


/* =========================================
   STATUS
========================================= */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


function showEditStatus(message,type){

    const status =
        document.getElementById("editStatus");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadImage(file){

    if(!file)
        return null;

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    const fileName =
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,10) +
        "." +
        extension;

    const filePath =
        "products/" +
        fileName;


    const { error } =
        await supabaseClient
            .storage
            .from("product-images")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );


    if(error)
        throw error;


    const { data } =
        supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(filePath);


    return {
        url:data.publicUrl,
        path:filePath
    };

}


/* =========================================
   ADD PRODUCT
========================================= */

async function saveProduct(){

    const button =
        document.getElementById("saveButton");

    const name =
        document.getElementById("name")
            .value
            .trim();

    const price =
        Number(
            document.getElementById("price")
                .value
        );

    const category =
        document.getElementById("category")
            .value;

    const categoryName =
        document.getElementById("categoryName")
            .value
            .trim();

    const description =
        document.getElementById("description")
            .value
            .trim();

    const file =
        document.getElementById("imageFile")
            .files[0];


    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;
    }

    if(!price || price < 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;
    }

    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;
    }

    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;
    }

    if(!file){

        showStatus(
            "اختار صورة المنتج.",
            "error"
        );

        return;
    }


    try{

        button.disabled =
            true;

        button.textContent =
            "جاري رفع الصورة...";


        const uploaded =
            await uploadImage(file);


        button.textContent =
            "جاري حفظ المنتج...";


        const { error } =
            await supabaseClient
                .from("elmansstore23")
                .insert({

                    name:name,
                    price:price,
                    category:category,
                    category_name:categoryName,
                    description:description,
                    image:uploaded.url

                });


        if(error){

            if(uploaded?.path){

                await supabaseClient
                    .storage
                    .from("product-images")
                    .remove([
                        uploaded.path
                    ]);

            }

            throw error;
        }


        showStatus(
            "تم إضافة المنتج بنجاح ✅",
            "success"
        );


        resetAddForm();

        await loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "حصل خطأ: " +
            (error.message || "خطأ غير معروف"),
            "error"
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            "إضافة المنتج";

    }

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const container =
        document.getElementById("productsList");

    container.innerHTML = `
        <div class="empty">
            <div class="icon">✦</div>
            <strong>جاري تحميل المنتجات...</strong>
        </div>
    `;


    const { data,error } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order("id",{
                ascending:false
            });


    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <div class="icon">!</div>
                <strong>تعذر تحميل المنتجات</strong>
                <p>${escapeHtml(error.message)}</p>
            </div>
        `;

        return;
    }


    products =
        Array.isArray(data)
            ? data
            : [];


    renderProducts();

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

    const container =
        document.getElementById("productsList");

    const search =
        document.getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        products.filter(product=>{

            const name =
                String(product.name || "")
                    .toLowerCase();

            const category =
                String(product.category_name || "")
                    .toLowerCase();

            return (
                name.includes(search) ||
                category.includes(search)
            );

        });


    if(filtered.length === 0){

        container.innerHTML = `
            <div class="empty">
                <div class="icon">✦</div>
                <strong>لا توجد منتجات</strong>
                <p>لم يتم العثور على نتائج.</p>
            </div>
        `;

        return;
    }


    container.innerHTML =
        filtered.map(product=>{

            const image =
                product.image || "";


            return `

                <div class="product-row">

                    <img
                        src="${escapeHtml(image)}"
                        alt=""
                        onerror="this.style.opacity='.2';">

                    <div class="product-info">

                        <strong>
                            ${escapeHtml(
                                product.name ||
                                "بدون اسم"
                            )}
                        </strong>

                        <small>
                            ${Number(
                                product.price || 0
                            ).toLocaleString("ar-EG")}
                            جنيه
                        </small>

                        <div class="category-text">
                            ${escapeHtml(
                                product.category_name ||
                                categoryNames[
                                    product.category
                                ] ||
                                ""
                            )}
                        </div>

                    </div>

                    <div class="product-actions">

                        <button
                            class="edit-btn"
                            onclick="openEdit(${Number(product.id)})">

                            ✏️ تعديل

                        </button>

                        <button
                            class="delete-btn"
                            onclick="openDelete(${Number(product.id)})">

                            🗑️ حذف

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================
   RESET ADD FORM
========================================= */

function resetAddForm(){

    document.getElementById("name").value = "";

    document.getElementById("price").value = "";

    document.getElementById("category").value = "";

    document.getElementById("categoryName").value = "";

    document.getElementById("description").value = "";

    document.getElementById("imageFile").value = "";

    const preview =
        document.getElementById("preview");

    preview.src = "";

    preview.style.display =
        "none";

}


/* =========================================
   OPEN EDIT
========================================= */

function openEdit(id){

    const product =
        products.find(
            item =>
                Number(item.id) === Number(id)
        );


    if(!product)
        return;


    editingProductId =
        Number(id);


    document.getElementById("editName")
        .value =
            product.name || "";


    document.getElementById("editPrice")
        .value =
            product.price || "";


    document.getElementById("editCategory")
        .value =
            product.category || "";


    document.getElementById("editCategoryName")
        .value =
            product.category_name || "";


    document.getElementById("editDescription")
        .value =
            product.description || "";


    document.getElementById("editImageFile")
        .value =
            "";


    document
        .getElementById("editStatus")
        .className =
            "status";


    document
        .getElementById("editModal")
        .classList
        .add("open");

}


/* =========================================
   CLOSE EDIT
========================================= */

function closeEditModal(){

    document
        .getElementById("editModal")
        .classList
        .remove("open");

    editingProductId =
        null;

}


/* =========================================
   SAVE EDIT
========================================= */

async function saveEdit(){

    if(!editingProductId)
        return;


    const button =
        document.getElementById(
            "editSaveButton"
        );


    const name =
        document.getElementById("editName")
            .value
            .trim();

    const price =
        Number(
            document.getElementById("editPrice")
                .value
        );

    const category =
        document.getElementById("editCategory")
            .value;

    const categoryName =
        document.getElementById("editCategoryName")
            .value
            .trim();

    const description =
        document.getElementById("editDescription")
            .value
            .trim();

    const file =
        document.getElementById("editImageFile")
            .files[0];


    if(!name){

        showEditStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;
    }

    if(!price || price < 0){

        showEditStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;
    }

    if(!category){

        showEditStatus(
            "اختار التصنيف.",
            "error"
        );

        return;
    }

    if(!categoryName){

        showEditStatus(
            "اكتب اسم التصنيف.",
            "error"
        );

        return;
    }


    try{

        button.disabled =
            true;

        button.textContent =
            "جاري الحفظ...";


        let imageUrl =
            null;


        if(file){

            button.textContent =
                "جاري رفع الصورة...";


            const uploaded =
                await uploadImage(file);


            imageUrl =
                uploaded.url;

        }


        const updateData = {

            name:name,
            price:price,
            category:category,
            category_name:categoryName,
            description:description

        };


        if(imageUrl){

            updateData.image =
                imageUrl;

        }


        button.textContent =
            "جاري تحديث المنتج...";


        const { error } =
            await supabaseClient
                .from("elmansstore23")
                .update(updateData)
                .eq(
                    "id",
                    editingProductId
                );


        if(error)
            throw error;


        showEditStatus(
            "تم حفظ التعديلات بنجاح ✅",
            "success"
        );


        await loadProducts();


        setTimeout(
            closeEditModal,
            700
        );


    }catch(error){

        console.error(error);

        showEditStatus(
            "حصل خطأ: " +
            (error.message || "خطأ غير معروف"),
            "error"
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            "حفظ التعديلات";

    }

}


/* =========================================
   DELETE MODAL
========================================= */

function openDelete(id){

    deletingProductId =
        Number(id);

    document
        .getElementById("deleteModal")
        .classList
        .add("open");

}


function closeDeleteModal(){

    document
        .getElementById("deleteModal")
        .classList
        .remove("open");

    deletingProductId =
        null;

}


/* =========================================
   CONFIRM DELETE
========================================= */

async function confirmDelete(){

    if(!deletingProductId)
        return;


    const id =
        deletingProductId;


    const product =
        products.find(
            item =>
                Number(item.id) === id
        );


    try{

        const { error } =
            await supabaseClient
                .from("elmansstore23")
                .delete()
                .eq("id",id);


        if(error)
            throw error;


        /*
         * حذف سجل المنتج من القائمة.
         */

        products =
            products.filter(
                item =>
                    Number(item.id) !== id
            );


        renderProducts();

        closeDeleteModal();


        showStatus(
            "تم حذف المنتج بنجاح 🗑️",
            "success"
        );


    }catch(error){

        console.error(error);

        closeDeleteModal();

        showStatus(
            "تعذر حذف المنتج: " +
            (error.message || "خطأ غير معروف"),
            "error"
        );

    }

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

    editingProductId =
        null;

    resetAddForm();

    document.getElementById("formTitle")
        .textContent =
            "إضافة منتج جديد";

}


/* =========================================
   CLOSE MODALS BY BACKGROUND
========================================= */

document
    .getElementById("editModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeEditModal();

            }

        }
    );


document
    .getElementById("deleteModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeDeleteModal();

            }

        }
    );


/* =========================================
   START
========================================= */

loadProducts();

</script>
