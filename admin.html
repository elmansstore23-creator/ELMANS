<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Luxury Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#030303;
    --black2:#070707;
    --card:#0d0d0d;
    --card2:#111;
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --white:#f7f7f7;
    --gray:#858585;
    --green:#62d17a;
    --red:#ff6868;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(212,175,55,.09),
            transparent 35%
        ),
        var(--black);
    color:var(--white);
    font-family:"Cairo",sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            rgba(255,255,255,.012) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.012) 1px,
            transparent 1px
        );
    background-size:45px 45px;
    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:rgba(3,3,3,.88);
    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(212,175,55,.15);
}

.brand-box{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-logo{
    width:47px;
    height:47px;

    object-fit:contain;

    filter:
        drop-shadow(0 0 7px rgba(212,175,55,.65))
        drop-shadow(0 0 18px rgba(212,175,55,.2));
}

.brand-text{
    direction:ltr;
    font-family:"Playfair Display",serif;
    font-size:25px;
    font-weight:700;
    letter-spacing:4px;
}

.brand-text span{
    color:var(--gold);
}

.admin-badge{
    padding:5px 10px;
    border:1px solid rgba(212,175,55,.3);
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
}

/* =========================
   MAIN
========================= */

.container{
    width:92%;
    max-width:1400px;
    margin:0 auto;
    padding:55px 0 80px;
}

/* =========================
   HERO
========================= */

.dashboard-title{
    position:relative;
    margin-bottom:40px;
}

.dashboard-title small{
    color:var(--gold);
    font-size:10px;
    letter-spacing:6px;
}

.dashboard-title h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(38px,6vw,68px);
    line-height:1.1;
    margin-top:8px;
}

.dashboard-title h1 span{
    color:var(--gold);
}

.dashboard-title p{
    color:#666;
    font-size:12px;
    margin-top:10px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:30px;
}

.stat-card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.008)
        );

    border:1px solid rgba(212,175,55,.14);

    padding:24px;

    transition:.35s;
}

.stat-card:hover{
    transform:translateY(-4px);
    border-color:rgba(212,175,55,.4);
}

.stat-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:rgba(212,175,55,.05);
    filter:blur(30px);
    left:-35px;
    bottom:-35px;
}

.stat-icon{
    color:var(--gold);
    font-size:22px;
    margin-bottom:13px;
}

.stat-label{
    color:#777;
    font-size:11px;
}

.stat-value{
    font-family:"Playfair Display",serif;
    font-size:32px;
    color:white;
    margin-top:3px;
}

/* =========================
   GRID
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:390px 1fr;
    gap:25px;
    align-items:start;
}

/* =========================
   CARD
========================= */

.panel{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.008)
        );

    border:1px solid rgba(212,175,55,.15);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);

    overflow:hidden;
}

.panel-header{
    padding:24px 25px;

    border-bottom:1px solid rgba(212,175,55,.1);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.panel-header h2{
    font-family:"Playfair Display",serif;
    font-size:24px;
}

.panel-header small{
    color:var(--gold);
    font-size:9px;
    letter-spacing:3px;
}

.panel-body{
    padding:25px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    color:#999;
    font-size:11px;
    margin-bottom:7px;
}

input,
textarea,
select{

    width:100%;

    padding:13px 14px;

    background:#050505;

    color:white;

    border:1px solid rgba(212,175,55,.15);

    outline:none;

    font-family:"Cairo",sans-serif;
    font-size:12px;

    transition:.3s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--gold);
    box-shadow:
        0 0 0 3px rgba(212,175,55,.05);
}

textarea{
    min-height:90px;
    resize:vertical;
}

select{
    cursor:pointer;
}

/* =========================
   IMAGE UPLOAD
========================= */

.upload-box{
    position:relative;

    border:1px dashed rgba(212,175,55,.3);

    background:#050505;

    min-height:150px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    overflow:hidden;

    transition:.3s;
}

.upload-box:hover{
    border-color:var(--gold);
}

.upload-content{
    pointer-events:none;
}

.upload-icon{
    font-size:28px;
    color:var(--gold);
}

.upload-content strong{
    display:block;
    margin-top:7px;
    font-size:12px;
}

.upload-content span{
    display:block;
    color:#666;
    font-size:9px;
    margin-top:4px;
}

#imageFile{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
}

.preview{
    display:none;
    width:100%;
    height:210px;
    object-fit:cover;
}

/* =========================
   BUTTON
========================= */

.add-button{
    width:100%;

    padding:15px;

    border:0;

    background:
        linear-gradient(
            135deg,
            var(--gold2),
            var(--gold)
        );

    color:#000;

    font-weight:800;

    font-family:"Cairo",sans-serif;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 10px 30px rgba(212,175,55,.08);
}

.add-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 15px 35px rgba(212,175,55,.18);
}

.add-button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    text-align:center;
    font-size:11px;
}

.status.success{
    display:block;
    color:var(--green);
    background:rgba(40,120,55,.1);
    border:1px solid rgba(80,190,100,.25);
}

.status.error{
    display:block;
    color:var(--red);
    background:rgba(150,30,30,.1);
    border:1px solid rgba(255,80,80,.2);
}

/* =========================
   PRODUCTS
========================= */

.products-tools{
    display:flex;
    align-items:center;
    gap:10px;
}

.search{
    width:220px;
}

.refresh-btn{
    width:42px;
    height:42px;

    border:1px solid rgba(212,175,55,.2);

    background:#050505;

    color:var(--gold);

    cursor:pointer;

    font-size:17px;
}

.refresh-btn:hover{
    border-color:var(--gold);
}

.products-list{
    padding:20px;
}

.product-row{
    display:grid;
    grid-template-columns:82px 1fr auto;

    gap:18px;

    align-items:center;

    padding:14px;

    margin-bottom:10px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.008)
        );

    border:1px solid rgba(212,175,55,.1);

    transition:.3s;
}

.product-row:hover{
    border-color:rgba(212,175,55,.35);
    transform:translateX(-3px);
}

.product-image{
    width:82px;
    height:82px;

    object-fit:cover;

    background:#050505;

    border:1px solid rgba(212,175,55,.15);
}

.product-info strong{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.product-category{
    display:inline-block;
    color:var(--gold);
    font-size:9px;
    margin-bottom:7px;
}

.product-description{
    color:#666;
    font-size:10px;

    max-width:550px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-price{
    color:var(--gold);
    font-size:14px;
    font-weight:800;

    white-space:nowrap;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:70px 20px;
    text-align:center;
    color:#555;
}

.empty-icon{
    color:var(--gold);
    font-size:35px;
    margin-bottom:10px;
}

.empty strong{
    display:block;
    color:#ddd;
    font-size:14px;
}

.empty p{
    font-size:10px;
    margin-top:5px;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:50px;
    text-align:center;
    color:#666;
}

.loader{
    width:28px;
    height:28px;

    border:2px solid rgba(212,175,55,.15);
    border-top-color:var(--gold);

    border-radius:50%;

    margin:0 auto 12px;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    padding:30px;
    border-top:1px solid rgba(212,175,55,.1);
    color:#555;
    font-size:10px;
}

.footer strong{
    color:var(--gold);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .form-panel{
        max-width:none;
    }

}

@media(max-width:700px){

    .header{
        height:72px;
        padding:0 4%;
    }

    .brand-logo{
        width:40px;
        height:40px;
    }

    .brand-text{
        font-size:20px;
        letter-spacing:3px;
    }

    .admin-badge{
        display:none;
    }

    .container{
        width:94%;
        padding-top:35px;
    }

    .dashboard-title{
        margin-bottom:25px;
    }

    .dashboard-title h1{
        font-size:42px;
    }

    .stats{
        grid-template-columns:1fr;
        gap:10px;
    }

    .stat-card{
        padding:18px;
    }

    .stat-value{
        font-size:27px;
    }

    .panel-header{
        padding:20px;
    }

    .panel-body{
        padding:18px;
    }

    .products-tools{
        width:100%;
    }

    .search{
        width:100%;
    }

    .products-tools{
        flex:1;
    }

    .products-list{
        padding:12px;
    }

    .product-row{
        grid-template-columns:65px 1fr;
        gap:12px;
    }

    .product-image{
        width:65px;
        height:65px;
    }

    .product-price{
        grid-column:2;
        margin-top:-5px;
    }

    .product-description{
        max-width:100%;
    }

}

@media(max-width:390px){

    .dashboard-title h1{
        font-size:36px;
    }

    .panel-header h2{
        font-size:20px;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand-box">

        <img
            class="brand-logo"
            src="logo.png.jpeg"
            alt="EL MANS">

        <div class="brand-text">
            <span>EL</span> MANS
        </div>

    </div>

    <div class="admin-badge">
        LUXURY ADMIN
    </div>

</header>


<main class="container">

    <!-- =========================
         TITLE
    ========================= -->

    <section class="dashboard-title">

        <small>
            EL MANS CONTROL CENTER
        </small>

        <h1>
            لوحة <span>الإدارة</span>
        </h1>

        <p>
            إدارة المنتجات والمجموعة الخاصة بـ EL MANS
        </p>

    </section>


    <!-- =========================
         STATS
    ========================= -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                ✦
            </div>

            <div class="stat-label">
                إجمالي المنتجات
            </div>

            <div
                class="stat-value"
                id="totalProducts">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ◈
            </div>

            <div class="stat-label">
                المنتجات المعروضة
            </div>

            <div
                class="stat-value"
                id="visibleProducts">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ◆
            </div>

            <div class="stat-label">
                التصنيفات
            </div>

            <div
                class="stat-value"
                id="totalCategories">
                0
            </div>

        </div>

    </section>


    <!-- =========================
         DASHBOARD
    ========================= -->

    <section class="dashboard-grid">


        <!-- =====================
             ADD PRODUCT
        ===================== -->

        <div class="panel form-panel">

            <div class="panel-header">

                <div>
                    <small>NEW EDITION</small>
                    <h2>إضافة منتج</h2>
                </div>

                <div style="color:#D4AF37;font-size:22px;">

                </div>

                <div class="form-group">

                        <option value="">

                        <option value="women-accessories">

                        </option>

                        <option value="men-chains">
                            سلاسل رجالي
                        </option>

                        <option value="women-chains">
                            سلاسل حريمي
                        </option>

                        <option value="gifts">
                            هدايا
                        </option>

                        <option value="teddy">
                            دباديب
                        </option>

                        <option value="men-perfume">
                            برفانات رجالي
                        </option>

                        <option value="women-perfume">
                            برفانات حريمي
                        </option>

                        <option value="men-body-splash">
                            بادي سبلاش رجالي
                        </option>

                        <option value="women-body-splash">
                            بادي سبلاش حريمي
                        </option>

                        <option value="parties">
                            حفلات
                        </option>

                        <option value="watches">
                            ساعات
                        </option>

                        <option value="engagement">
                            دبل خطوبة
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        اسم التصنيف بالعربي
                    </label>

                    <input
                        type="text"
                        id="categoryName"
                        placeholder="اكسسوارات حريمي">

                </div>


                <div class="form-group">

                    <label>
                        وصف المنتج
                    </label>

                    <textarea
                        id="description"
                        placeholder="اكتب وصف المنتج..."></textarea>

                </div>


                <div class="form-group">

                    <label>
                        صورة المنتج
                    </label>

                    <div class="upload-box">

                        <div
                            class="upload-content"
                            id="uploadContent">

                            <div class="upload-icon">
                                ↑
                            </div>

                            <strong>
                                اختر صورة المنتج
                            </strong>

                            <span>
                                JPG / PNG / WEBP
                            </span>

                        </div>

                        <img
                            id="preview"
                            class="preview"
                            alt="Preview">

                    </div>

                </div>


                <button
                    class="add-button"
                    id="addButton"
                    onclick="addProduct()">

                    إضافة المنتج إلى EL MANS

                </button>


                <div
                    id="status"
                    class="status">
                </div>

            </div>

        </div>


        <!-- =====================
             PRODUCTS
        ===================== -->

        <div class="panel">

            <div class="panel-header">

                <div>

                    <h2>
                        المنتجات

                </div>

                <div class="products-tools">

                    <input
                        class="search"
                        type="text"
                        id="search"
                        placeholder="ابحث عن منتج...">

                    <button
                        class="refresh-btn"
                        onclick="loadProducts()"

    </section>

</main>


<footer class="footer">

    <strong>
        EL MANS
    </strong>

    — Luxury Admin Dashboard © 2026

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let allProducts = [];


/* =========================================
   IMAGE PREVIEW
========================================= */

document
    .getElementById("imageFile")
    .addEventListener("change", function(){

        const file = this.files[0];

        const preview =
            document.getElementById("preview");

        const uploadContent =
            document.getElementById("uploadContent");

        if(!file){

            preview.style.display = "none";

            uploadContent.style.display = "block";

            preview.src = "";

            return;
        }

        preview.src =
            URL.createObjectURL(file);

        preview.style.display = "block";

        uploadContent.style.display = "none";

    });


/* =========================================
   STATUS
========================================= */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================================
   ADD PRODUCT
========================================= */

async function addProduct(){

    const button =
        document.getElementById("addButton");

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("price")
                .value
        );

    const category =
        document
            .getElementById("category")
            .value;

    const categoryName =
        document
            .getElementById("categoryName")
            .value
            .trim();

    const description =
        document
            .getElementById("description")
            .value
            .trim();

    const file =
        document
            .getElementById("imageFile")
            .files[0];


    /* VALIDATION */

    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;
    }

    if(!price || price < 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;
    }

    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;
    }

    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;
    }

    if(!file){

        showStatus(
            "اختار صورة المنتج.",
            "error"
        );

        return;
    }


    try{

        button.disabled = true;

        button.textContent =
            "جاري رفع الصورة...";


        /* FILE NAME */

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const fileName =
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,9) +
            "." +
            extension;

        const filePath =
            "products/" +
            fileName;


        /* UPLOAD */

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


        if(uploadError){

            throw uploadError;

        }


        button.textContent =
            "جاري حفظ المنتج...";


        /* PUBLIC URL */

        const { data: publicData } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                    filePath
                );


        const imageUrl =
            publicData.publicUrl;


        /* INSERT */

        const { error } =
            await supabaseClient
                .from("elmansstore23")
                .insert({

                    name:name,

                    price:price,

                    category:category,

                    category_name:categoryName,

                    description:description,

                    image:imageUrl

                });


        if(error){

            await supabaseClient
                .storage
                .from("product-images")
                .remove([
                    filePath
                ]);

            throw error;

        }


        showStatus(
            "تم إضافة المنتج بنجاح ✦",
            "success"
        );


        resetForm();

        await loadProducts();


    }catch(error){

        console.error(
            "ADD PRODUCT ERROR:",
            error
        );

        showStatus(
            "حصل خطأ: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "إضافة المنتج إلى EL MANS";

    }

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

    document
        .getElementById("name")
        .value = "";

    document
        .getElementById("price")
        .value = "";

    document
        .getElementById("category")
        .value = "";

    document
        .getElementById("categoryName")
        .value = "";

    document
        .getElementById("description")
        .value = "";

    document
        .getElementById("imageFile")
        .value = "";

    const preview =
        document.getElementById("preview");

    preview.src = "";

    preview.style.display =
        "none";

    document
        .getElementById("uploadContent")
        .style.display =
        "block";

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const container =
        document.getElementById("productsList");

    container.innerHTML = `
        <div class="loading">
            <div class="loader"></div>
            جاري تحميل المجموعة...
        </div>
    `;


    const { data, error } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order(
                "id",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    !
                </div>

                <strong>
                    تعذر تحميل المنتجات
                </strong>

                <p>
                    تأكد من اتصال Supabase
                </p>

            </div>
        `;

        return;

    }


    allProducts =
        Array.isArray(data)
        ? data
        : [];


    updateStats();

    renderProducts(
        allProducts
    );

}


/* =========================================
   STATS
========================================= */

function updateStats(){

    document
        .getElementById("totalProducts")
        .textContent =
            allProducts.length;


    document
        .getElementById("visibleProducts")
        .textContent =
            allProducts.length;


    const categories =
        new Set(
            allProducts.map(
                product =>
                    product.category
            ).filter(Boolean)
        );


    document
        .getElementById("totalCategories")
        .textContent =
            categories.size;

}


/* =========================================
   RENDER
========================================= */

function renderProducts(products){

    const container =
        document.getElementById("productsList");


    if(!products.length){

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ✦
                </div>

                <strong>
                    لا توجد منتجات
                </strong>

                <p>
                    أضف أول منتج إلى المجموعة
                </p>

            </div>
        `;

        return;

    }


    container.innerHTML =
        products.map(
            product => `

                <div class="product-row">

                    <img
                        class="product-image"
                        src="${escapeHtml(
                            product.image || ""
                        )}"
                        alt=""
                        onerror="
                            this.style.opacity='.2'
                        ">


                    <div class="product-info">

                        <span
                            class="product-category">

                            ${escapeHtml(
                                product.category_name ||
                                product.category ||
                                "EL MANS"
                            )}

                        </span>

                        <strong>

                            ${escapeHtml(
                                product.name ||
                                "بدون اسم"
                            )}

                        </strong>

                        <div
                            class="product-description">

                            ${escapeHtml(
                                product.description ||
                                "لا يوجد وصف"
                            )}

                        </div>

                    </div>


                    <div class="product-price">

                        ${Number(
                            product.price || 0
                        ).toLocaleString("ar-EG")}

                        جنيه

                    </div>

                </div>

            `
        ).join("");

}


/* =========================================
   SEARCH
========================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function(){

            const query =
                this.value
                    .trim()
                    .toLowerCase();


            if(!query){

                renderProducts(
                    allProducts
                );

                document
                    .getElementById(
                        "visibleProducts"
                    )
                    .textContent =
                        allProducts.length;

                return;

            }


            const filtered =
                allProducts.filter(
                    product => {

                        const name =
                            String(
                                product.name || ""
                            ).toLowerCase();

                        const category =
                            String(
                                product.category_name || ""
                            ).toLowerCase();

                        const description =
                            String(
                                product.description || ""
                            ).toLowerCase();


                        return (
                            name.includes(query) ||
                            category.includes(query) ||
                            description.includes(query)
                        );

                    }
                );


            renderProducts(
                filtered
            );


            document
                .getElementById(
                    "visibleProducts"
                )
                .textContent =
                    filtered.length;

        }
    );


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   START
========================================= */

loadProducts();

</script>
