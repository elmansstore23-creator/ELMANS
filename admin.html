<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#030303;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:30px 15px;
}

.container{
    width:100%;
    max-width:750px;
    margin:auto;
}

.logo{
    text-align:center;
    color:#D4AF37;
    font-size:32px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.card{
    background:#0d0d0d;
    border:1px solid rgba(212,175,55,.25);
    padding:25px;
}

h2{
    color:#D4AF37;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    background:#050505;
    color:#fff;
    border:1px solid rgba(212,175,55,.2);
    outline:none;
    font-size:14px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#D4AF37;
}

button{
    width:100%;
    padding:15px;
    border:0;
    background:#D4AF37;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.preview{
    margin-top:10px;
    display:none;
    width:160px;
    height:160px;
    object-fit:cover;
    border:1px solid #D4AF37;
}

.status{
    margin-top:18px;
    padding:12px;
    display:none;
    text-align:center;
    font-size:13px;
}

.success{
    display:block;
    background:#102010;
    color:#70d070;
    border:1px solid #286628;
}

.error{
    display:block;
    background:#200d0d;
    color:#ff7777;
    border:1px solid #662828;
}

.products{
    margin-top:30px;
}

.product-row{
    background:#101010;
    border:1px solid rgba(212,175,55,.12);
    padding:15px;
    margin-bottom:10px;
    display:flex;
    gap:15px;
    align-items:center;
}

.product-row img{
    width:70px;
    height:70px;
    object-fit:cover;
    background:#050505;
}

.product-data{
    flex:1;
}

.product-data strong{
    display:block;
    margin-bottom:5px;
}

.product-data small{
    color:#D4AF37;
}

@media(max-width:500px){
    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        EL MANS
    </div>

    <div class="subtitle">
        لوحة التحكم
    </div>

    <div class="card">

        <h2>
            إضافة منتج جديد
        </h2>

        <div class="form-group">

            <label>
                اسم المنتج
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثال: اسورة ذهبية">

        </div>

        <div class="form-group">

            <label>
                السعر بالجنيه
            </label>

            <input
                type="number"
                id="price"
                placeholder="250"
                min="0">

        </div>

        <div class="form-group">

            <label>
                التصنيف
            </label>

            <select id="category">

                <option value="">
                    اختر التصنيف
                </option>

                <option value="men-accessories">
                    اكسسوارات رجالي
                </option>

                <option value="women-accessories">
                    اكسسوارات حريمي
                </option>

                <option value="men-chains">
                    سلاسل رجالي
                </option>

                <option value="women-chains">
                    سلاسل حريمي
                </option>

                <option value="gifts">
                    هدايا
                </option>

                <option value="teddy">
                    دباديب
                </option>

                <option value="men-perfume">
                    برفانات رجالي
                </option>

                <option value="women-perfume">
                    برفانات حريمي
                </option>

                <option value="men-body-splash">
                    بادي سبلاش رجالي
                </option>

                <option value="women-body-splash">
                    بادي سبلاش حريمي
                </option>

                <option value="parties">
                    حفلات
                </option>

                <option value="watches">
                    ساعات
                </option>

                <option value="engagement">
                    دبل خطوبة
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                اسم التصنيف بالعربي
            </label>

            <input
                type="text"
                id="categoryName"
                placeholder="اكسسوارات حريمي">

        </div>

        <div class="form-group">

            <label>
                وصف المنتج
            </label>

            <textarea
                id="description"
                placeholder="اكتب وصف المنتج..."></textarea>

        </div>

        <div class="form-group">

            <label>
                صورة المنتج
            </label>

            <input
                type="file"
                id="imageFile"
                accept="image/*">

            <img
                id="preview"
                class="preview"
                alt="معاينة الصورة">

        </div>

        <button
            id="addButton"
            onclick="addProduct()">

            إضافة المنتج

        </button>

        <div
            id="status"
            class="status">
        </div>

    </div>

    <div class="products">

        <h2>
            المنتجات الحالية
        </h2>

        <div id="productsList"></div>

    </div>

</div>

<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================================
   IMAGE PREVIEW
================================ */

document
    .getElementById("imageFile")
    .addEventListener("change", function(){

        const file = this.files[0];

        const preview =
            document.getElementById("preview");

        if(!file){

            preview.style.display = "none";
            preview.src = "";

            return;
        }

        preview.src =
            URL.createObjectURL(file);

        preview.style.display = "block";

    });


/* ================================
   STATUS
================================ */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* ================================
   ADD PRODUCT
================================ */

async function addProduct(){

    const button =
        document.getElementById("addButton");

    const name =
        document.getElementById("name")
        .value
        .trim();

    const price =
        Number(
            document.getElementById("price")
            .value
        );

    const category =
        document.getElementById("category")
        .value;

    const categoryName =
        document.getElementById("categoryName")
        .value
        .trim();

    const description =
        document.getElementById("description")
        .value
        .trim();

    const file =
        document.getElementById("imageFile")
        .files[0];


    /* VALIDATION */

    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;
    }

    if(!price || price < 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;
    }

    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;
    }

    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;
    }

    if(!file){

        showStatus(
            "اختار صورة المنتج.",
            "error"
        );

        return;
    }


    try{

        button.disabled = true;

        button.textContent =
            "جاري رفع الصورة...";


        /* ================================
           FILE NAME
        ================================= */

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const fileName =
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,9) +
            "." +
            extension;


        const filePath =
            "products/" +
            fileName;


        /* ================================
           UPLOAD IMAGE
        ================================= */

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


        if(uploadError){

            throw uploadError;

        }


        button.textContent =
            "جاري حفظ المنتج...";


        /* ================================
           PUBLIC IMAGE URL
        ================================= */

        const { data: publicData } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(filePath);


        const imageUrl =
            publicData.publicUrl;


        /* ================================
           INSERT PRODUCT
        ================================= */

        const { data, error } =
            await supabaseClient
                .from("elmansstore23")
                .insert({

                    name:name,

                    price:price,

                    category:category,

                    category_name:categoryName,

                    description:description,

                    image:imageUrl

                })
                .select();


        if(error){

            /* حاول حذف الصورة لو حفظ المنتج فشل */

            await supabaseClient
                .storage
                .from("product-images")
                .remove([filePath]);

            throw error;

        }


        showStatus(
            "تم إضافة المنتج بنجاح ✅",
            "success"
        );


        /* ================================
           RESET
        ================================= */

        document
            .getElementById("name")
            .value = "";

        document
            .getElementById("price")
            .value = "";

        document
            .getElementById("category")
            .value = "";

        document
            .getElementById("categoryName")
            .value = "";

        document
            .getElementById("description")
            .value = "";

        document
            .getElementById("imageFile")
            .value = "";

        document
            .getElementById("preview")
            .style.display = "none";


        loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "حصل خطأ: " +
            (error.message || "خطأ غير معروف"),
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "إضافة المنتج";

    }

}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

    const container =
        document.getElementById("productsList");

    container.innerHTML =
        "جاري تحميل المنتجات...";


    const { data, error } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order("id", {
                ascending:false
            });


    if(error){

        container.innerHTML =
            "تعذر تحميل المنتجات.";

        console.error(error);

        return;

    }


    if(!data || data.length === 0){

        container.innerHTML =
            "لا توجد منتجات.";

        return;

    }


    container.innerHTML =
        data.map(product => `

            <div class="product-row">

                <img
                    src="${product.image || ""}"
                    alt="">

                <div class="product-data">

                    <strong>
                        ${escapeHtml(
                            product.name ||
                            "بدون اسم"
                        )}
                    </strong>

                    <small>
                        ${Number(
                            product.price || 0
                        ).toLocaleString("ar-EG")}
                        جنيه
                    </small>

                </div>

            </div>

        `).join("");

}


/* ================================
   ESCAPE
================================ */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ================================
   START
================================ */

loadProducts();

</script>

</body>
</html>
