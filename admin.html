<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Luxury Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#030303;
    --black2:#070707;
    --card:#0d0d0d;
    --card2:#111;
    --gold:#D4AF37;
    --gold-light:#F5DD87;
    --white:#f7f7f7;
    --gray:#858585;
    --border:rgba(212,175,55,.16);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,rgba(212,175,55,.09),transparent 35%),
        var(--black);
    color:var(--white);
    font-family:"Cairo",sans-serif;
}

button,
input,
textarea,
select{
    font-family:"Cairo",sans-serif;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:rgba(3,3,3,.88);
    backdrop-filter:blur(20px);

    border-bottom:1px solid var(--border);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-logo{
    width:52px;
    height:52px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 6px rgba(212,175,55,.65))
        drop-shadow(0 0 18px rgba(212,175,55,.18));
}

.brand-name{
    direction:ltr;
    font-family:"Playfair Display",serif;
    font-size:25px;
    font-weight:700;
    letter-spacing:4px;
}

.brand-name span{
    color:var(--gold);
}

.admin-badge{
    padding:6px 12px;
    border:1px solid rgba(212,175,55,.25);
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:min(1250px,92%);
    margin:0 auto;
    padding:45px 0 80px;
}

/* =========================
   HERO
========================= */

.admin-hero{
    position:relative;
    overflow:hidden;

    padding:42px;

    margin-bottom:25px;

    background:
        radial-gradient(circle at 80% 30%,rgba(212,175,55,.09),transparent 35%),
        linear-gradient(145deg,#111,#070707);

    border:1px solid var(--border);
}

.admin-hero::after{
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    border-radius:50%;
    left:-80px;
    bottom:-120px;
    background:rgba(212,175,55,.04);
    filter:blur(50px);
}

.hero-small{
    color:var(--gold);
    font-size:10px;
    letter-spacing:5px;
}

.admin-hero h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(35px,6vw,60px);
    margin:8px 0;
}

.admin-hero h1 span{
    color:var(--gold);
}

.admin-hero p{
    color:#777;
    font-size:12px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    padding:22px;
    background:linear-gradient(145deg,#111,#090909);
    border:1px solid var(--border);
    position:relative;
    overflow:hidden;
}

.stat::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:70px;
    height:2px;
    background:var(--gold);
}

.stat-label{
    color:#777;
    font-size:10px;
}

.stat-value{
    display:block;
    color:var(--gold);
    font-family:"Playfair Display",serif;
    font-size:30px;
    margin-top:5px;
}

/* =========================
   MAIN GRID
========================= */

.main-grid{
    display:grid;
    grid-template-columns:1fr 1.25fr;
    gap:25px;
    align-items:start;
}

.card{
    background:
        linear-gradient(145deg,rgba(255,255,255,.025),transparent),
        var(--card);

    border:1px solid var(--border);
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    margin-bottom:25px;
    padding-bottom:18px;

    border-bottom:1px solid rgba(255,255,255,.06);
}

.card-title small{
    color:var(--gold);
    font-size:9px;
    letter-spacing:3px;
}

.card-title h2{
    font-family:"Playfair Display",serif;
    font-size:27px;
    margin-top:3px;
}

.card-icon{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(212,175,55,.25);
    color:var(--gold);
    font-size:19px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    color:#aaa;
    font-size:11px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;

    padding:13px 14px;

    background:#050505;
    color:white;

    border:1px solid rgba(212,175,55,.15);

    outline:none;

    font-size:12px;

    transition:.25s;
}

input::placeholder,
textarea::placeholder{
    color:#555;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(212,175,55,.75);
    box-shadow:0 0 0 3px rgba(212,175,55,.045);
}

textarea{
    min-height:95px;
    resize:vertical;
}

select{
    appearance:auto;
}

.file-box{
    position:relative;
}

input[type="file"]{
    padding:11px;
    color:#888;
}

input[type="file"]::file-selector-button{
    margin-left:10px;
    padding:8px 13px;

    border:1px solid rgba(212,175,55,.35);

    background:#111;
    color:var(--gold);

    cursor:pointer;
}

/* =========================
   IMAGE PREVIEW
========================= */

.preview-wrap{
    display:none;
    margin-top:12px;
    padding:10px;
    background:#050505;
    border:1px solid rgba(212,175,55,.2);
}

.preview-wrap.show{
    display:block;
}

.preview{
    width:100%;
    max-height:250px;
    object-fit:contain;
    display:block;
}

/* =========================
   ADD BUTTON
========================= */

.add-button{
    width:100%;
    margin-top:8px;
    padding:15px;

    border:1px solid var(--gold);

    background:linear-gradient(
        135deg,
        var(--gold),
        #b89220
    );

    color:#000;

    font-size:13px;
    font-weight:800;

    transition:.3s;
}

.add-button:hover{
    background:var(--gold-light);
    transform:translateY(-2px);
    box-shadow:0 12px 35px rgba(212,175,55,.15);
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    margin-top:15px;
    padding:12px 14px;
    font-size:11px;
    text-align:center;
}

.status.success{
    display:block;
    color:#82df82;
    background:#0d1c0d;
    border:1px solid #285c28;
}

.status.error{
    display:block;
    color:#ff8585;
    background:#200d0d;
    border:1px solid #662828;
}

/* =========================
   PRODUCTS
========================= */

.products-list{
    max-height:650px;
    overflow:auto;
    padding-left:4px;
}

.products-list::-webkit-scrollbar{
    width:4px;
}

.products-list::-webkit-scrollbar-thumb{
    background:rgba(212,175,55,.35);
}

.product-row{
    display:flex;
    align-items:center;
    gap:14px;

    padding:13px;
    margin-bottom:10px;

    background:#090909;
    border:1px solid rgba(255,255,255,.055);

    transition:.3s;
}

.product-row:hover{
    border-color:rgba(212,175,55,.3);
    transform:translateX(-3px);
}

.product-image{
    width:72px;
    height:72px;
    flex:none;

    object-fit:cover;

    background:#050505;

    border:1px solid rgba(212,175,55,.15);
}

.product-data{
    min-width:0;
    flex:1;
}

.product-data strong{
    display:block;

    color:#eee;
    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-category{
    display:block;
    color:var(--gold);
    font-size:9px;
    margin-top:3px;
}

.product-price{
    display:block;
    color:#aaa;
    font-size:10px;
    margin-top:4px;
}

.product-id{
    color:#555;
    font-size:9px;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
    padding:50px 20px;
    text-align:center;
    color:#666;

    border:1px dashed rgba(212,175,55,.15);
}

.empty-symbol{
    color:var(--gold);
    font-size:30px;
    margin-bottom:8px;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:45px;
    padding-top:25px;
    border-top:1px solid rgba(255,255,255,.06);
}

.footer-brand{
    direction:ltr;
    font-family:"Playfair Display",serif;
    font-size:20px;
    letter-spacing:4px;
}

.footer-brand span{
    color:var(--gold);
}

.footer p{
    color:#555;
    font-size:9px;
    margin-top:7px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .main-grid{
        grid-template-columns:1fr;
    }

    .products-list{
        max-height:none;
    }
}

@media(max-width:650px){

    .topbar{
        height:70px;
        padding:0 4%;
    }

    .brand-logo{
        width:43px;
        height:43px;
    }

    .brand-name{
        font-size:20px;
        letter-spacing:3px;
    }

    .admin-badge{
        display:none;
    }

    .container{
        width:94%;
        padding-top:25px;
    }

    .admin-hero{
        padding:28px 22px;
    }

    .stats{
        grid-template-columns:1fr;
        gap:10px;
    }

    .stat{
        padding:16px;
    }

    .stat-value{
        font-size:25px;
    }

    .card{
        padding:20px 16px;
    }

    .card-title h2{
        font-size:23px;
    }

    .product-row{
        padding:10px;
    }

    .product-image{
        width:62px;
        height:62px;
    }
}

@media(max-width:390px){

    .brand-name{
        font-size:18px;
    }

    .admin-hero h1{
        font-size:35px;
    }
}
</style>
</head>

<body>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   IMAGE PREVIEW
========================================= */

document
    .getElementById("imageFile")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];

            const preview =
                document.getElementById("preview");

            const wrap =
                document.getElementById("previewWrap");

            if(!file){

                wrap.classList.remove("show");

                preview.src = "";

                return;

            }

            preview.src =
                URL.createObjectURL(file);

            wrap.classList.add("show");

        }
    );


/* =========================================
   STATUS
========================================= */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================================
   ADD PRODUCT
========================================= */

async function addProduct(){

    const button =
        document.getElementById("addButton");

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("price")
                .value
        );

    const category =
        document
            .getElementById("category")
            .value;

    const categoryName =
        document
            .getElementById("categoryName")
            .value
            .trim();

    const description =
        document
            .getElementById("description")
            .value
            .trim();

    const file =
        document
            .getElementById("imageFile")
            .files[0];


    /* VALIDATION */

    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;

    }


    if(!Number.isFinite(price) || price <= 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;

    }


    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;

    }


    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;

    }


    if(!file){

        showStatus(
            "اختار صورة المنتج.",
            "error"
        );

        return;

    }


    try{

        button.disabled = true;

        button.textContent =
            "جاري رفع الصورة...";


        /* FILE NAME */

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const fileName =
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,9) +
            "." +
            extension;

        const filePath =
            "products/" +
            fileName;


        /* UPLOAD */

        const {
            error:uploadError
        } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


        if(uploadError){

            throw uploadError;

        }


        button.textContent =
            "جاري حفظ المنتج...";


        /* PUBLIC URL */

        const {
            data:publicData
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(filePath);


        const imageUrl =
            publicData.publicUrl;


        /* INSERT */

        const {
            error
        } =
            await supabaseClient
                .from("elmansstore23")
                .insert({

                    name:name,

                    price:price,

                    category:category,

                    category_name:categoryName,

                    description:description,

                    image:imageUrl

                });


        if(error){

            /* DELETE IMAGE IF INSERT FAILS */

            await supabaseClient
                .storage
                .from("product-images")
                .remove([
                    filePath
                ]);

            throw error;

        }


        showStatus(
            "تم إضافة المنتج بنجاح ✅",
            "success"
        );


        /* RESET */

        document
            .getElementById("name")
            .value = "";

        document
            .getElementById("price")
            .value = "";

        document
            .getElementById("category")
            .value = "";

        document
            .getElementById("categoryName")
            .value = "";

        document
            .getElementById("description")
            .value = "";

        document
            .getElementById("imageFile")
            .value = "";

        document
            .getElementById("preview")
            .src = "";

        document
            .getElementById("previewWrap")
            .classList.remove("show");


        await loadProducts();


    }catch(error){

        console.error(
            "ADD PRODUCT ERROR:",
            error
        );

        showStatus(
            "حصل خطأ: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "إضافة المنتج";

    }

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const container =
        document.getElementById("productsList");

    const counter =
        document.getElementById("productsCount");


    container.innerHTML = `

        <div class="empty">

            <div class="empty-symbol">
                ✦
            </div>

            جاري تحميل المنتجات...

        </div>

    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order(
                "id",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                <div class="empty-symbol">
                    !
                </div>

                تعذر تحميل المنتجات.

            </div>

        `;

        return;

    }


    const products =
        Array.isArray(data)
            ? data
            : [];


    counter.textContent =
        products.length;


    if(products.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-symbol">
                    ✦
                </div>

                لا توجد منتجات حاليًا.

            </div>

        `;

        return;

    }


    container.innerHTML =
        products
            .map(product => {

                const image =
                    product.image || "";

                const name =
                    product.name ||
                    "بدون اسم";

                const category =
                    product.category_name ||
                    product.category ||
                    "بدون تصنيف";

                const price =
                    Number(
                        product.price || 0
                    );


                return `

                    <div class="product-row">

                        <img
                            class="product-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(name)}"
                            loading="lazy"
                            onerror="this.style.opacity='.25';">

                        <div class="product-data">

                            <strong>
                                ${escapeHtml(name)}
                            </strong>

                            <span class="product-category">
                                ${escapeHtml(category)}
                            </span>

                            <span class="product-price">
                                ${price.toLocaleString("ar-EG")}
                                جنيه
                            </span>

                        </div>

                        <span class="product-id">
                            #${Number(product.id)}
                        </span>

                    </div>

                `;

            })
            .join("");

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   START
========================================= */

loadProducts();

</script>
