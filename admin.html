<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Luxury Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#030303;
    --black2:#080808;
    --card:#101010;
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --white:#f8f8f8;
    --gray:#888;
    --red:#e05252;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(212,175,55,.08),transparent 35%),
        var(--black);
    color:var(--white);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

/* =========================
   TOP
========================= */

.top{
    width:100%;
    padding:35px 20px 20px;
    text-align:center;
}

.logo-box{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo-box img{
    width:105px;
    height:105px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 7px rgba(212,175,55,.7))
        drop-shadow(0 0 22px rgba(212,175,55,.25));
}

.brand{
    direction:ltr;
    font-family:Georgia,serif;
    font-size:34px;
    font-weight:bold;
    letter-spacing:5px;
    margin-top:4px;
}

.brand span{
    color:var(--gold);
}

.subtitle{
    color:#777;
    font-size:11px;
    letter-spacing:4px;
    margin-top:8px;
}

.gold-line{
    width:150px;
    height:1px;
    margin:20px auto 0;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

/* =========================
   CONTAINER
========================= */

.container{
    width:92%;
    max-width:1250px;
    margin:30px auto 80px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        );
    border:1px solid rgba(212,175,55,.15);
    padding:22px;
    position:relative;
    overflow:hidden;
}

.stat::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:rgba(212,175,55,.04);
    filter:blur(25px);
    left:-30px;
    bottom:-40px;
}

.stat-label{
    color:#777;
    font-size:10px;
    letter-spacing:2px;
}

.stat-value{
    color:var(--gold);
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.stat-icon{
    position:absolute;
    left:20px;
    top:20px;
    color:rgba(212,175,55,.5);
    font-size:22px;
}

/* =========================
   CARD
========================= */

.card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.008)
        );
    border:1px solid rgba(212,175,55,.18);
    padding:28px;
    margin-bottom:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.card-title h2{
    font-family:Georgia,serif;
    font-size:25px;
}

.card-title h2 span{
    color:var(--gold);
}

.card-title small{
    color:#666;
    font-size:10px;
    letter-spacing:2px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.form-group{
    margin-bottom:2px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#aaa;
    font-size:11px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    background:#050505;
    color:#fff;
    border:1px solid rgba(212,175,55,.16);
    outline:none;
    font-size:13px;
    border-radius:0;
    transition:.25s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(212,175,55,.05);
}

textarea{
    min-height:105px;
    resize:vertical;
}

.file-box{
    border:1px dashed rgba(212,175,55,.3);
    padding:18px;
    background:#050505;
}

.file-box input{
    border:0;
    padding:5px;
}

.preview{
    width:130px;
    height:130px;
    object-fit:cover;
    margin-top:12px;
    border:1px solid var(--gold);
    display:none;
}

/* =========================
   BUTTONS
========================= */

.main-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.main-btn:hover{
    background:var(--gold2);
    transform:translateY(-2px);
}

.main-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:1px solid rgba(255,255,255,.12);
    background:transparent;
    color:#999;
    cursor:pointer;
    display:none;
}

/* =========================
   STATUS
========================= */

.status{
    margin-top:15px;
    padding:13px;
    display:none;
    text-align:center;
    font-size:12px;
}

.status.success{
    display:block;
    color:#79d879;
    background:#0d1d0d;
    border:1px solid #265d26;
}

.status.error{
    display:block;
    color:#ff7777;
    background:#210c0c;
    border:1px solid #642525;
}

/* =========================
   SEARCH
========================= */

.toolbar{
    display:grid;
    grid-template-columns:1fr 230px;
    gap:10px;
    margin-bottom:20px;
}

.search{
    position:relative;
}

.search input{
    padding-right:45px;
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold);
}

/* =========================
   PRODUCTS
========================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product{
    background:#0a0a0a;
    border:1px solid rgba(212,175,55,.12);
    overflow:hidden;
    transition:.3s;
}

.product:hover{
    border-color:rgba(212,175,55,.55);
    transform:translateY(-3px);
}

.product-image{
    height:230px;
    background:#050505;
    position:relative;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-badge{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--gold);
    color:#000;
    padding:5px 9px;
    font-size:8px;
    font-weight:bold;
}

.product-info{
    padding:16px;
}

.product-category{
    color:var(--gold);
    font-size:9px;
}

.product-name{
    font-size:15px;
    font-weight:bold;
    margin-top:7px;
}

.product-description{
    color:#666;
    font-size:10px;
    line-height:1.8;
    margin-top:7px;
    min-height:36px;
}

.product-price{
    color:var(--gold);
    font-weight:bold;
    margin-top:12px;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:14px;
}

.edit-btn,
.delete-btn{
    padding:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:10px;
}

.edit-btn{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
}

.delete-btn{
    border:1px solid rgba(224,82,82,.4);
    background:transparent;
    color:#e05252;
}

.empty{
    grid-column:1/-1;
    min-height:220px;
    border:1px dashed rgba(212,175,55,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#666;
}

.empty strong{
    color:white;
    margin-bottom:7px;
}

.empty span{
    color:var(--gold);
    font-size:35px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:5000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(500px,100%);
    max-height:90vh;
    overflow:auto;
    background:#090909;
    border:1px solid rgba(212,175,55,.3);
    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-head h3{
    color:var(--gold);
}

.close{
    width:35px;
    height:35px;
    border:1px solid rgba(212,175,55,.2);
    background:transparent;
    color:white;
    cursor:pointer;
    font-size:20px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .toolbar{
        grid-template-columns:1fr;
    }

}

@media(max-width:520px){

    .container{
        width:94%;
    }

    .card{
        padding:18px;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .product-image{
        height:270px;
    }

    .brand{
        font-size:28px;
    }

}
</style>
</head>

<!-- =========================

<section class="card">

            <option value="all">

            </option>

            <option value="women-accessories">

            </option>

            </option>

            </option>

            </option>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let products = [];

let editingId = null;

let deleteTarget = null;


/* =========================================
   STATUS
========================================= */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =========================================
   IMAGE PREVIEW
========================================= */

document
    .getElementById("imageFile")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];

            const preview =
                document.getElementById("preview");

            if(!file){

                preview.src = "";
                preview.style.display = "none";

                return;

            }

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

        }
    );


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const container =
        document.getElementById("productsList");

    container.innerHTML = `
        <div class="empty">
            <span>✦</span>
            <strong>جاري تحميل المنتجات</strong>
            <small>لحظات...</small>
        </div>
    `;

    const {
        data,
        error
    } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order(
                "id",
                {
                    ascending:false
                }
            );

    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <span>!</span>
                <strong>تعذر تحميل المنتجات</strong>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;

        return;

    }

    products =
        Array.isArray(data)
        ? data
        : [];

    updateStats();

    renderProducts();

}


/* =========================================
   STATS
========================================= */

function updateStats(){

    document
        .getElementById("totalProducts")
        .textContent =
            products.length;

    const categories =
        new Set(
            products
                .map(item =>
                    item.category
                )
                .filter(Boolean)
        );

    document
        .getElementById("totalCategories")
        .textContent =
            categories.size;

}


/* =========================================
   RENDER
========================================= */

function renderProducts(){

    const container =
        document.getElementById("productsList");

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const filter =
        document
            .getElementById("filter")
            .value;


    const filtered =
        products.filter(product => {

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const matchesSearch =
                name.includes(search);

            const matchesFilter =
                filter === "all" ||
                product.category === filter;

            return (
                matchesSearch &&
                matchesFilter
            );

        });


    if(filtered.length === 0){

        container.innerHTML = `
            <div class="empty">
                <span>✦</span>
                <strong>لا توجد منتجات</strong>
                <small>جرب تغيير البحث أو التصنيف.</small>
            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered.map(product => {

            const image =
                product.image || "";

            const category =
                product.category_name ||
                product.category ||
                "";

            return `

                <article class="product">

                    <div class="product-image">

                        <span class="product-badge">
                            EL MANS
                        </span>

                        ${
                            image
                            ?
                            `<img
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.name || "")}"
                                onerror="this.style.display='none';">`
                            :
                            ""
                        }

                    </div>


                    <div class="product-info">

                        <div class="product-category">
                            ${escapeHtml(category)}
                        </div>

                        <div class="product-name">
                            ${escapeHtml(
                                product.name ||
                                "بدون اسم"
                            )}
                        </div>

                        <div class="product-description">
                            ${escapeHtml(
                                product.description ||
                                "لا يوجد وصف"
                            )}
                        </div>

                        <div class="product-price">
                            ${
                                Number(
                                    product.price || 0
                                ).toLocaleString("ar-EG")
                            }
                            جنيه
                        </div>


                        <div class="product-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct(${Number(product.id)})">

                                تعديل

                            </button>

                            <button
                                class="delete-btn"
                                onclick="openDeleteModal(${Number(product.id)})">

                                حذف

                            </button>

                        </div>

                    </div>

                </article>

            `;

        }).join("");

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

    const button =
        document.getElementById("mainButton");

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("price")
                .value
        );

    const category =
        document
            .getElementById("category")
            .value;

    const categoryName =
        document
            .getElementById("categoryName")
            .value
            .trim();

    const description =
        document
            .getElementById("description")
            .value
            .trim();

    const file =
        document
            .getElementById("imageFile")
            .files[0];


    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;

    }

    if(!price || price < 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;

    }

    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;

    }

    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;

    }


    try{

        button.disabled = true;


        /* =================================
           EDIT
        ================================= */

        if(editingId){

            button.textContent =
                "جاري تحديث المنتج...";


            let imageUrl =
                products.find(
                    item =>
                        Number(item.id) ===
                        Number(editingId)
                )?.image || "";


            if(file){

                button.textContent =
                    "جاري رفع الصورة الجديدة...";


                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,9) +
                    "." +
                    extension;


                const filePath =
                    "products/" +
                    fileName;


                const {
                    error:uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("product-images")
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl:"3600",
                                upsert:false
                            }
                        );


                if(uploadError)
                    throw uploadError;


                const {
                    data:publicData
                } =
                    supabaseClient
                        .storage
                        .from("product-images")
                        .getPublicUrl(
                            filePath
                        );


                imageUrl =
                    publicData.publicUrl;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("elmansstore23")
                    .update({

                        name:name,
                        price:price,
                        category:category,
                        category_name:categoryName,
                        description:description,
                        image:imageUrl

                    })
                    .eq(
                        "id",
                        editingId
                    );


            if(error)
                throw error;


            showStatus(
                "تم تحديث المنتج بنجاح ✅",
                "success"
            );


            cancelEdit();

            await loadProducts();

            return;

        }


        /* =================================
           NEW PRODUCT
        ================================= */

        if(!file){

            showStatus(
                "اختار صورة المنتج.",
                "error"
            );

            return;

        }


        button.textContent =
            "جاري رفع الصورة...";


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const fileName =
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2,9) +
            "." +
            extension;


        const filePath =
            "products/" +
            fileName;


        const {
            error:uploadError
        } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


        if(uploadError)
            throw uploadError;


        button.textContent =
            "جاري حفظ المنتج...";


        const {
            data:publicData
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                    filePath
                );


        const imageUrl =
            publicData.publicUrl;


        const {
            error
        } =
            await supabaseClient
                .from("elmansstore23")
                .insert({

                    name:name,
                    price:price,
                    category:category,
                    category_name:categoryName,
                    description:description,
                    image:imageUrl

                });


        if(error){

            await supabaseClient
                .storage
                .from("product-images")
                .remove([
                    filePath
                ]);

            throw error;

        }


        showStatus(
            "تم إضافة المنتج بنجاح ✅",
            "success"
        );


        clearForm();

        await loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "حصل خطأ: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }finally{

        button.disabled = false;

        if(!editingId){

            button.textContent =
                "إضافة المنتج";

        }

    }

}


/* =========================================
   EDIT
========================================= */

function editProduct(id){

    const product =
        products.find(
            item =>
                Number(item.id) ===
                Number(id)
        );

    if(!product)
        return;


    editingId =
        product.id;


    document
        .getElementById("name")
        .value =
            product.name || "";


    document
        .getElementById("price")
        .value =
            product.price || "";


    document
        .getElementById("category")
        .value =
            product.category || "";


    document
        .getElementById("categoryName")
        .value =
            product.category_name || "";


    document
        .getElementById("description")
        .value =
            product.description || "";


    const preview =
        document.getElementById("preview");


    if(product.image){

        preview.src =
            product.image;

        preview.style.display =
            "block";

    }


    document
        .getElementById("mainButton")
        .textContent =
            "حفظ التعديلات";


    document
        .getElementById("cancelButton")
        .style.display =
            "block";


    document
        .getElementById("formMode")
        .textContent =
            "EDIT PRODUCT";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

    editingId = null;

    clearForm();

    document
        .getElementById("mainButton")
        .textContent =
            "إضافة المنتج";

    document
        .getElementById("cancelButton")
        .style.display =
            "none";

    document
        .getElementById("formMode")
        .textContent =
            "NEW PRODUCT";

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

    document
        .getElementById("name")
        .value = "";

    document
        .getElementById("price")
        .value = "";

    document
        .getElementById("category")
        .value = "";

    document
        .getElementById("categoryName")
        .value = "";

    document
        .getElementById("description")
        .value = "";

    document
        .getElementById("imageFile")
        .value = "";

    const preview =
        document.getElementById("preview");

    preview.src = "";

    preview.style.display =
        "none";

}


/* =========================================
   DELETE MODAL
========================================= */

function openDeleteModal(id){

    const product =
        products.find(
            item =>
                Number(item.id) ===
                Number(id)
        );

    if(!product)
        return;


    deleteTarget =
        product;


    document
        .getElementById("deleteText")
        .textContent =
            `هل أنت متأكد إنك عايز تحذف "${product.name || "هذا المنتج"}"؟ سيتم حذف المنتج من المتجر.`;

    document
        .getElementById("deleteModal")
        .classList.add("open");

}


function closeDeleteModal(){

    deleteTarget =
        null;

    document
        .getElementById("deleteModal")
        .classList.remove("open");

}


/* =========================================
   CONFIRM DELETE
========================================= */

async function confirmDelete(){

    if(!deleteTarget)
        return;


    const product =
        deleteTarget;


    try{

        /* حذف قاعدة البيانات */

        const {
            error
        } =
            await supabaseClient
                .from("elmansstore23")
                .delete()
                .eq(
                    "id",
                    product.id
                );


        if(error)
            throw error;


        /*
           محاولة حذف الصورة القديمة
           من Storage لو كانت من
           product-images
        */

        if(product.image){

            try{

                const marker =
                    "/product-images/";

                const index =
                    product.image.indexOf(
                        marker
                    );


                if(index !== -1){

                    const filePath =
                        product.image
                            .substring(
                                index +
                                marker.length
                            );

                    await supabaseClient
                        .storage
                        .from(
                            "product-images"
                        )
                        .remove([
                            filePath
                        ]);

                }

            }catch(imageError){

                console.warn(
                    "Image delete warning:",
                    imageError
                );

            }

        }


        closeDeleteModal();

        showStatus(
            "تم حذف المنتج بنجاح ✅",
            "success"
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "فشل حذف المنتج: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

   START
========================================= */

loadProducts();
