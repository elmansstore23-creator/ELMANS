<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Luxury Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --black:#030303;
    --black2:#080808;
    --card:#101010;
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --white:#f8f8f8;
    --gray:#888;
    --danger:#d94b4b;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,rgba(212,175,55,.09),transparent 35%),
        var(--black);
    color:var(--white);
    font-family:Arial,sans-serif;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at center,rgba(212,175,55,.1),transparent 40%),
        #030303;
}

.login-box{
    width:min(430px,100%);
    padding:40px 30px;
    background:rgba(12,12,12,.96);
    border:1px solid rgba(212,175,55,.3);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    color:var(--gold);
    font-family:Georgia,serif;
    font-size:38px;
    font-weight:bold;
    letter-spacing:5px;
}

.logo span{
    color:#fff;
}

.login-subtitle{
    text-align:center;
    color:#666;
    font-size:12px;
    margin:10px 0 30px;
}

.login-box input{
    width:100%;
    margin-bottom:12px;
    padding:14px;
    background:#050505;
    color:#fff;
    border:1px solid rgba(212,175,55,.2);
    outline:none;
}

.login-box input:focus{
    border-color:var(--gold);
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    background:var(--gold);
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.login-error{
    display:none;
    color:#ff7777;
    font-size:12px;
    text-align:center;
    margin-top:15px;
}

/* =========================
   APP
========================= */

.app{
    display:none;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:76px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(3,3,3,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(212,175,55,.15);
}

.header-logo{
    font-family:Georgia,serif;
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
}

.header-logo span{
    color:var(--gold);
}

.admin-user{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-email{
    color:#777;
    font-size:11px;
}

.logout{
    padding:8px 14px;
    border:1px solid rgba(212,175,55,.3);
    background:transparent;
    color:var(--gold);
    cursor:pointer;
    font-size:11px;
}

.container{
    width:90%;
    max-width:1350px;
    margin:40px auto;
}

/* =========================
   HERO
========================= */

.admin-title{
    margin-bottom:30px;
}

.admin-title small{
    color:var(--gold);
    letter-spacing:5px;
    font-size:10px;
}

.admin-title h1{
    font-family:Georgia,serif;
    font-size:clamp(35px,5vw,58px);
    margin-top:8px;
}

.admin-title h1 span{
    color:var(--gold);
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:30px;
}

.stat{
    padding:22px;
    background:linear-gradient(145deg,#111,#080808);
    border:1px solid rgba(212,175,55,.13);
}

.stat small{
    color:#777;
    font-size:10px;
}

.stat strong{
    display:block;
    color:var(--gold);
    font-size:28px;
    margin-top:8px;
}

/* =========================
   LAYOUT
========================= */

.grid{
    display:grid;
    grid-template-columns:390px 1fr;
    gap:20px;
}

.card{
    background:rgba(13,13,13,.95);
    border:1px solid rgba(212,175,55,.18);
    padding:25px;
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.card-title h2{
    font-family:Georgia,serif;
    font-size:23px;
}

.card-title span{
    color:var(--gold);
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    color:#999;
    font-size:11px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    background:#050505;
    color:#fff;
    border:1px solid rgba(212,175,55,.16);
    outline:none;
    font-size:12px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--gold);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.preview{
    width:100%;
    max-height:220px;
    object-fit:cover;
    margin-top:10px;
    display:none;
    border:1px solid rgba(212,175,55,.3);
}

.primary-btn{
    width:100%;
    padding:14px;
    border:0;
    background:var(--gold);
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.secondary-btn{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid rgba(212,175,55,.3);
    background:transparent;
    color:var(--gold);
    cursor:pointer;
    display:none;
}

.status{
    display:none;
    padding:11px;
    margin-top:15px;
    text-align:center;
    font-size:11px;
}

.success{
    display:block;
    background:#102010;
    color:#70d070;
    border:1px solid #286628;
}

.error{
    display:block;
    background:#200d0d;
    color:#ff7777;
    border:1px solid #662828;
}

/* =========================
   PRODUCTS
========================= */

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.toolbar input{
    flex:1;
}

.toolbar select{
    width:190px;
}

.products-list{
    display:grid;
    gap:10px;
}

.product-row{
    display:flex;
    align-items:center;
    gap:15px;
    padding:14px;
    background:#0b0b0b;
    border:1px solid rgba(212,175,55,.1);
    transition:.25s;
}

.product-row:hover{
    border-color:rgba(212,175,55,.35);
    transform:translateY(-2px);
}

.product-row img{
    width:80px;
    height:80px;
    object-fit:cover;
    background:#050505;
    border:1px solid rgba(212,175,55,.12);
}

.product-data{
    flex:1;
    min-width:0;
}

.product-data strong{
    display:block;
    font-size:14px;
    margin-bottom:6px;
}

.product-data small{
    display:block;
    color:var(--gold);
    margin-bottom:4px;
}

.product-data .category{
    color:#666;
    font-size:10px;
}

.actions{
    display:flex;
    gap:7px;
}

.edit-btn,
.delete-btn{
    padding:8px 11px;
    cursor:pointer;
    font-size:10px;
}

.edit-btn{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
}

.delete-btn{
    border:1px solid rgba(217,75,75,.5);
    background:transparent;
    color:#ff7777;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:50px 20px;
    text-align:center;
    color:#666;
    border:1px dashed rgba(212,175,55,.15);
}

.empty span{
    display:block;
    color:var(--gold);
    font-size:30px;
    margin-bottom:8px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){

    .grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:650px){

    .header{
        padding:0 4%;
    }

    .admin-email{
        display:none;
    }

    .container{
        width:94%;
        margin:25px auto;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
    }

    .toolbar select{
        width:100%;
    }

    .product-row{
        align-items:flex-start;
    }

    .product-row img{
        width:65px;
        height:65px;
    }

    .actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="logo">
            EL <span>MANS</span>
        </div>

        <div class="login-subtitle">
            LUXURY ADMINISTRATION
        </div>

        <input
            type="email"
            id="loginEmail"
            placeholder="البريد الإلكتروني">

        <input
            type="password"
            id="loginPassword"
            placeholder="كلمة المرور">

        <button
            class="login-btn"
            onclick="login()">

            دخول لوحة التحكم

        </button>

        <div
            class="login-error"
            id="loginError">
        </div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div class="app" id="app">

<header class="header">

    <div class="header-logo">
        EL <span>MANS</span>
    </div>

    <div class="admin-user">

        <span
            class="admin-email"
            id="adminEmail">
        </span>

        <button
            class="logout"
            onclick="logout()">

            خروج

        </button>

    </div>

</header>


<main class="container">

    <div class="admin-title">

        <small>
            EL MANS CONTROL CENTER
        </small>

        <h1>
            لوحة <span>الإدارة</span>
        </h1>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <small>
                إجمالي المنتجات
            </small>

            <strong id="totalProducts">
                0
            </strong>

        </div>

        <div class="stat">

            <small>
                المنتجات الظاهرة
            </small>

            <strong id="visibleProducts">
                0
            </strong>

        </div>

        <div class="stat">

            <small>
                قيمة المنتجات
            </small>

            <strong id="totalValue">
                0 جنيه
            </strong>

        </div>

    </div>


    <div class="grid">


        <!-- FORM -->

        <section class="card">

            <div class="card-title">

                <h2 id="formTitle">
                    إضافة <span>منتج</span>
                </h2>

            </div>


            <div class="form-group">

                <label>
                    اسم المنتج
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="مثال: اسورة ذهبية">

            </div>


            <div class="form-group">

                <label>
                    السعر بالجنيه
                </label>

                <input
                    id="price"
                    type="number"
                    min="0"
                    placeholder="250">

            </div>


            <div class="form-group">

                <label>
                    التصنيف
                </label>

                <select id="category">

                    <option value="">
                        اختر التصنيف
                    </option>

                    <option value="men-accessories">
                        اكسسوارات رجالي
                    </option>

                    <option value="women-accessories">
                        اكسسوارات حريمي

                    <option value="men-chains">

                    </option>

                    <option value="women-chains">
                        سلاسل حريمي

                    <option value="gifts">
                        هدايا
                    </option>

                    <option value="teddy">
                        دباديب
                    </option>

                    <option value="men-perfume">
                        برفانات رجالي
                    </option>

                    <option value="women-perfume">
                        برفانات حريمي
                    </option>

                    <option value="men-body-splash">
                        بادي سبلاش رجالي
                    </option>

                    <option value="women-body-splash">
                        بادي سبلاش حريمي
                    </option>

                    <option value="parties">
                        حفلات
                    </option>

                    <option value="watches">
                        ساعات
                    </option>

                    <option value="engagement">
                        دبل خطوبة
                    </option>

                </select>

            </div>


            <div class="form-group">

                    اسم التصنيف بالعربي
                </label>

                    id="categoryName"

            <div class="form-group">

                    وصف المنتج

            <div class="form-group">

                <label>

                <input

                <img

            </div>


            <button
                id="saveButton"
                class="primary-btn"
                onclick="saveProduct()">

                إضافة المنتج

            </button>


            <button
                id="cancelEdit"
                class="secondary-btn"
                onclick="cancelEdit()">

                إلغاء التعديل

            </button>


            <div
                id="status"
                class="status">
            </div>

        </section>


        <!-- PRODUCTS -->

        <section class="card">

            <div class="card-title">

                <h2>
                    المنتجات <span>الحالية</span>
                </h2>

            </div>


            <div class="toolbar">

                <input
                    id="search"
                    type="search"
                    placeholder="ابحث عن منتج..."
                    oninput="renderProducts()">

                <select
                    id="filter"
                    onchange="renderProducts()">

                    <option value="all">
                        كل التصنيفات
                    </option>

                    <option value="men-accessories">
                        اكسسوارات رجالي
                    </option>

                    <option value="women-accessories">
                        اكسسوارات حريمي
                    </option>

                    <option value="men-chains">
                        سلاسل رجالي
                    </option>

                    <option value="women-chains">
                        سلاسل حريمي
                    </option>

                    <option value="gifts">
                        هدايا
                    </option>

                    <option value="teddy">
                        دباديب
                    </option>

                    <option value="men-perfume">
                        برفانات رجالي
                    </option>

                    <option value="women-perfume">
                        برفانات حريمي
                    </option>

                    <option value="watches">
                        ساعات
                    </option>

                </select>

            </div>


            <div
                id="productsList"
                class="products-list">

                <div class="empty">
                    <span>✦</span>
                    جاري تحميل المنتجات...
                </div>

            </div>

        </section>

    </div>

</main>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   VARIABLES
===================================== */

let products = [];
let editingId = null;


/* =====================================
   AUTH
===================================== */

async function checkSession(){

    const {
        data:{
            session
        }
    } = await supabaseClient.auth.getSession();

    if(session){

        showAdmin(session);

    }else{

        showLogin();

    }

}


function showAdmin(session){

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("app")
        .style.display = "block";

    document
        .getElementById("adminEmail")
        .textContent =
            session.user.email || "";

    loadProducts();

}


function showLogin(){

    document
        .getElementById("loginScreen")
        .style.display = "flex";

    document
        .getElementById("app")
        .style.display = "none";

}


async function login(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const errorBox =
        document.getElementById("loginError");

    errorBox.style.display = "none";

    if(!email || !password){

        errorBox.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        errorBox.style.display = "block";

        return;
    }


    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });


    if(error){

        errorBox.textContent =
            "بيانات الدخول غير صحيحة.";

        errorBox.style.display = "block";

        return;

    }


    showAdmin(data.session);

}


async function logout(){

    await supabaseClient.auth.signOut();

    editingId = null;

    showLogin();

}


/* =====================================
   STATUS
===================================== */

function showStatus(message,type){

    const box =
        document.getElementById("status");

    box.textContent =
        message;

    box.className =
        "status " + type;

}


/* =====================================
   IMAGE PREVIEW
===================================== */

document
    .getElementById("imageFile")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];

            const preview =
                document.getElementById("preview");

            if(!file){

                preview.style.display = "none";
                preview.src = "";

                return;

            }

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

        }
    );


/* =====================================
   LOAD PRODUCTS
===================================== */

async function loadProducts(){

    const container =
        document.getElementById("productsList");

    container.innerHTML = `
        <div class="empty">
            <span>✦</span>
            جاري تحميل المنتجات...
        </div>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("elmansstore23")
        .select("*")
        .order("id",{
            ascending:false
        });


    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <span>!</span>
                تعذر تحميل المنتجات
            </div>
        `;

        return;

    }


    products =
        Array.isArray(data)
        ? data
        : [];


    updateStats();

    renderProducts();

}


/* =====================================
   STATS
===================================== */

function updateStats(){

    document
        .getElementById("totalProducts")
        .textContent =
            products.length;


    const totalValue =
        products.reduce(
            (sum,item)=>
                sum +
                Number(item.price || 0),
            0
        );


    document
        .getElementById("totalValue")
        .textContent =
            totalValue.toLocaleString("ar-EG") +
            " جنيه";

}


/* =====================================
   RENDER
===================================== */

function renderProducts(){

    const container =
        document.getElementById("productsList");

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const filter =
        document
            .getElementById("filter")
            .value;


    const filtered =
        products.filter(product=>{

            const name =
                String(product.name || "")
                .toLowerCase();

            const category =
                String(product.category || "");


            const matchesSearch =
                !search ||
                name.includes(search);


            const matchesFilter =
                filter === "all" ||
                category === filter;


            return (
                matchesSearch &&
                matchesFilter
            );

        });


    document
        .getElementById("visibleProducts")
        .textContent =
            filtered.length;


    if(filtered.length === 0){

        container.innerHTML = `
            <div class="empty">
                <span>✦</span>
                لا توجد منتجات مطابقة
            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered.map(product=>`

            <div class="product-row">

                <img
                    src="${escapeHtml(
                        product.image || ""
                    )}"
                    alt="">

                <div class="product-data">

                    <strong>
                        ${escapeHtml(
                            product.name ||
                            "بدون اسم"
                        )}
                    </strong>

                    <small>
                        ${Number(
                            product.price || 0
                        ).toLocaleString("ar-EG")}
                        جنيه
                    </small>

                    <div class="category">
                        ${escapeHtml(
                            product.category_name ||
                            product.category ||
                            ""
                        )}
                    </div>

                </div>

                <div class="actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct(${Number(product.id)})">

                        تعديل

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${Number(product.id)})">

                        حذف

                    </button>

                </div>

            </div>

        `).join("");

}


/* =====================================
   EDIT
===================================== */

function editProduct(id){

    const product =
        products.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if(!product)
        return;


    editingId =
        product.id;


    document
        .getElementById("name")
        .value =
            product.name || "";


    document
        .getElementById("price")
        .value =
            product.price || "";


    document
        .getElementById("category")
        .value =
            product.category || "";


    document
        .getElementById("categoryName")
        .value =
            product.category_name || "";


    document
        .getElementById("description")
        .value =
            product.description || "";


    const preview =
        document.getElementById("preview");


    if(product.image){

        preview.src =
            product.image;

        preview.style.display =
            "block";

    }else{

        preview.style.display =
            "none";

    }


    document
        .getElementById("formTitle")
        .innerHTML =
            'تعديل <span>المنتج</span>';


    document
        .getElementById("saveButton")
        .textContent =
            "حفظ التعديلات";


    document
        .getElementById("cancelEdit")
        .style.display =
            "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================
   SAVE / UPDATE
===================================== */

async function saveProduct(){

    const button =
        document.getElementById("saveButton");


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById("price")
                .value
        );


    const category =
        document
            .getElementById("category")
            .value;


    const categoryName =
        document
            .getElementById("categoryName")
            .value
            .trim();


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    const file =
        document
            .getElementById("imageFile")
            .files[0];


    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;

    }


    if(!price || price < 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;

    }


    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;

    }


    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;

    }


    try{

        button.disabled = true;

        button.textContent =
            editingId
            ? "جاري الحفظ..."
            : "جاري رفع الصورة...";


        let imageUrl = null;


        /* =========================
           UPLOAD NEW IMAGE
        ========================= */

        if(file){

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2,9) +
                "." +
                extension;


            const filePath =
                "products/" +
                fileName;


            const {
                error:uploadError
            } =
                await supabaseClient
                    .storage
                    .from("product-images")
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false
                        }
                    );


            if(uploadError)
                throw uploadError;


            const {
                data:publicData
            } =
                supabaseClient
                    .storage
                    .from("product-images")
                    .getPublicUrl(
                        filePath
                    );


            imageUrl =
                publicData.publicUrl;

        }


        /* =========================
           UPDATE
        ========================= */

        if(editingId){

            const updateData = {

                name:name,

                price:price,

                category:category,

                category_name:categoryName,

                description:description

            };


            if(imageUrl){

                updateData.image =
                    imageUrl;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("elmansstore23")
                    .update(updateData)
                    .eq("id",editingId);


            if(error)
                throw error;


            showStatus(
                "تم تعديل المنتج بنجاح ✅",
                "success"
            );


        }else{


            /* =========================
               INSERT
            ========================= */

            if(!imageUrl){

                throw new Error(
                    "اختار صورة المنتج."
                );

            }


            const {
                error
            } =
                await supabaseClient
                    .from("elmansstore23")
                    .insert({

                        name:name,

                        price:price,

                        category:category,

                        category_name:categoryName,

                        description:description,

                        image:imageUrl

                    });


            if(error)
                throw error;


            showStatus(
                "تم إضافة المنتج بنجاح ✅",
                "success"
            );

        }


        resetForm();

        await loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "حصل خطأ: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            editingId
            ? "حفظ التعديلات"
            : "إضافة المنتج";

    }

}


/* =====================================
   DELETE
===================================== */

async function deleteProduct(id){

    const product =
        products.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if(!product)
        return;


    const confirmed =
        confirm(
            "متأكد إنك عاوز تحذف المنتج؟"
        );


    if(!confirmed)
        return;


    try{

        const {
            error
        } =
            await supabaseClient
                .from("elmansstore23")
                .delete()
                .eq("id",id);


        if(error)
            throw error;


        showStatus(
            "تم حذف المنتج بنجاح 🗑️",
            "success"
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "تعذر حذف المنتج: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }

}


/* =====================================
   CANCEL
===================================== */

function cancelEdit(){

    resetForm();

}


function resetForm(){

    editingId = null;


    document
        .getElementById("name")
        .value = "";


    document
        .getElementById("price")
        .value = "";


    document
        .getElementById("category")
        .value = "";


    document
        .getElementById("categoryName")
        .value = "";


    document
        .getElementById("description")
        .value = "";


    document
        .getElementById("imageFile")
        .value = "";


    document
        .getElementById("preview")
        .style.display = "none";


    document
        .getElementById("formTitle")
        .innerHTML =
            'إضافة <span>منتج</span>';


    document
        .getElementById("saveButton")
        .textContent =
            "إضافة المنتج";


    document
        .getElementById("cancelEdit")
        .style.display =
            "none";

}


/* =====================================
   ESCAPE
===================================== */

function escapeHtml(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}
