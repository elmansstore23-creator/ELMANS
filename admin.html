<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#030303;
    --black2:#080808;
    --card:#101010;
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --white:#f8f8f8;
    --gray:#888;
    --red:#d9534f;
    --green:#43b581;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(212,175,55,.08),transparent 35%),
        var(--black);
    color:var(--white);
    font-family:Arial,"Tahoma",sans-serif;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:min(430px,100%);
    background:rgba(12,12,12,.96);
    border:1px solid rgba(212,175,55,.3);
    padding:40px 30px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 50px rgba(212,175,55,.04);
}

.login-logo{
    text-align:center;
    direction:ltr;
    font-family:Georgia,serif;
    font-size:38px;
    font-weight:bold;
    letter-spacing:5px;
}

.login-logo span{
    color:var(--gold);
}

.login-line{
    width:100px;
    height:1px;
    margin:18px auto 25px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

.login-title{
    text-align:center;
    color:#aaa;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    padding:14px;
    background:#050505;
    border:1px solid rgba(212,175,55,.18);
    color:white;
    outline:none;
    border-radius:2px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--gold);
}

.login-btn,
.primary-btn{
    width:100%;
    padding:15px;
    border:0;
    background:var(--gold);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover,
.primary-btn:hover{
    background:var(--gold2);
    transform:translateY(-1px);
}

.error{
    color:#ff7777;
    font-size:12px;
    text-align:center;
    margin-top:15px;
    min-height:18px;
}

/* =========================
   ADMIN
========================= */

#adminScreen{
    display:none;
    min-height:100vh;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:75px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(3,3,3,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(212,175,55,.15);
}

.logo{
    direction:ltr;
    font-family:Georgia,serif;
    font-size:24px;
    font-weight:bold;
    letter-spacing:4px;
}

.logo span{
    color:var(--gold);
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:#aaa;
    font-size:11px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

.logout-btn{
    padding:9px 15px;
    border:1px solid rgba(212,175,55,.3);
    background:transparent;
    color:var(--gold);
    cursor:pointer;
    font-size:11px;
}

.logout-btn:hover{
    background:var(--gold);
    color:#000;
}

/* =========================
   CONTENT
========================= */

.container{
    width:90%;
    max-width:1400px;
    margin:0 auto;
    padding:45px 0 80px;
}

.page-heading{
    margin-bottom:30px;
}

.page-heading small{
    color:var(--gold);
    letter-spacing:4px;
    font-size:10px;
}

.page-heading h1{
    font-family:Georgia,serif;
    font-size:42px;
    margin-top:8px;
}

.page-heading p{
    color:#666;
    font-size:12px;
    margin-top:8px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:35px;
}

.stat{
    background:var(--card);
    border:1px solid rgba(212,175,55,.13);
    padding:22px;
}

.stat small{
    color:#777;
    font-size:10px;
}

.stat strong{
    display:block;
    color:var(--gold);
    font-size:30px;
    margin-top:8px;
}

/* =========================
   PANEL
========================= */

.panel{
    background:#090909;
    border:1px solid rgba(212,175,55,.14);
    padding:25px;
    margin-bottom:25px;
}

.panel-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:22px;
}

.panel-title h2{
    font-size:19px;
}

.panel-title small{
    color:var(--gold);
    font-size:10px;
    letter-spacing:3px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.form-grid .full{
    grid-column:1/-1;
}

.form-grid textarea{
    min-height:100px;
    resize:vertical;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.form-buttons button{
    flex:1;
}

.secondary-btn{
    padding:15px;
    border:1px solid rgba(212,175,55,.3);
    background:transparent;
    color:#aaa;
    cursor:pointer;
}

.secondary-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
}

/* =========================
   PRODUCTS
========================= */

.products-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.search{
    width:280px;
    max-width:100%;
    padding:12px;
    background:#050505;
    border:1px solid rgba(212,175,55,.15);
    color:white;
    outline:none;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:right;
    color:var(--gold);
    font-size:11px;
    padding:14px;
    background:#050505;
    border-bottom:1px solid rgba(212,175,55,.15);
}

td{
    padding:13px;
    color:#aaa;
    font-size:11px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

tr:hover td{
    background:rgba(212,175,55,.025);
}

.product-thumb{
    width:55px;
    height:55px;
    object-fit:cover;
    background:#050505;
    border:1px solid rgba(212,175,55,.15);
}

.action-btn{
    padding:7px 10px;
    margin-left:4px;
    border:1px solid rgba(212,175,55,.25);
    background:transparent;
    color:var(--gold);
    cursor:pointer;
    font-size:10px;
}

.action-btn.delete{
    color:#ff7777;
    border-color:rgba(255,100,100,.25);
}

.action-btn:hover{
    background:var(--gold);
    color:#000;
}

.action-btn.delete:hover{
    background:#d9534f;
    color:white;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#666;
}

.empty strong{
    display:block;
    color:#aaa;
    margin-bottom:7px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:25px;
    bottom:25px;
    z-index:9999;
    min-width:250px;
    padding:15px 18px;
    background:#101010;
    border:1px solid rgba(212,175,55,.3);
    color:white;
    transform:translateY(120px);
    opacity:0;
    transition:.35s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.toast.success{
    border-color:rgba(67,181,129,.5);
}

.toast.error-toast{
    border-color:rgba(217,83,79,.5);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-grid .full{
        grid-column:auto;
    }

    .header{
        padding:0 4%;
    }

    .status{
        display:none;
    }

    .container{
        width:94%;
    }

    .page-heading h1{
        font-size:34px;
    }

    .panel{
        padding:18px;
    }

    .products-toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<section id="loginScreen">

    <div class="login-box">

        <div class="login-logo">
            <span>EL</span> MANS
        </div>

        <div class="login-line"></div>

        <div class="login-title">
            PRIVATE ADMIN PANEL
        </div>

        <div class="field">

            <label>
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="admin@example.com"
                autocomplete="email"
            >

        </div>

        <div class="field">

            <label>

            </label>

            <input

                placeholder="••••••••"
                autocomplete="current-password"

        <button

            دخول لوحة التحكم

        </button>

        <div
            class="error"
            id="loginError">
        </div>

    </div>

</section>


<!-- =========================
     ADMIN SCREEN
========================= -->

<section id="adminScreen">

    <header class="header">

        <div class="logo">
            <span>EL</span> MANS
        </div>

        <div class="header-right">

            <div class="status">

                <span class="status-dot"></span>

                متصل بـ Supabase

            </div>

            <button
                class="logout-btn"
                onclick="logout()">

                تسجيل الخروج

            </button>

        </div>

    </header>


    <main class="container">

        <div class="page-heading">

            <small>
                EL MANS CONTROL CENTER
            </small>

            <h1>
                لوحة التحكم
            </h1>

            <p>
                إدارة المنتجات والمجموعة الخاصة بمتجر EL MANS.
            </p>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <small>
                    إجمالي المنتجات
                </small>

                <strong id="totalProducts">
                    0
                </strong>

            </div>

            <div class="stat">

                <small>
                    المنتجات المعروضة
                </small>

                <strong id="visibleProducts">
                    0
                </strong>

            </div>

            <div class="stat">

                <small>
                    حالة النظام
                </small>

                <strong style="font-size:18px;">
                    ONLINE
                </strong>

            </div>

        </div>


        <!-- ADD / EDIT -->

        <div class="panel">

            <div class="panel-title">

                <div>
                    <small>
                        PRODUCT MANAGEMENT
                    </small>

                    <h2 id="formTitle">
                        إضافة منتج جديد
                    </h2>
                </div>

            </div>


            <div class="form-grid">

                <div class="field">

                    <label>

                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="مثال: ساعة فاخرة">

                </div>


                <div class="field">

                    <label>

                    <input

                        id="productPrice"

                <div class="field">

                    <select id="productCategory">

                        <option value="women-chains">

                        <option value="teddy">

                        <option value="men-perfume">

                        </option>

                        <option value="women-perfume">
                            برفانات حريمي
                        </option>

                        <option value="men-body-splash">
                            بادي سبلاش رجالي
                        </option>

                        <option value="women-body-splash">
                            بادي سبلاش حريمي
                        </option>

                        <option value="parties">
                            حفلات
                        </option>

                        </option>

                        </option>

                    </select>

                </div>


                <div class="field">

                    </label>

                    <input
                        type="text"

                </div>


                <div class="field full">

                    <label>
                        رابط صورة المنتج
                    </label>

                    <input

                <div class="field full">

                    </label>

            <div class="form-buttons">

                <button

        <!-- PRODUCTS -->

        <div class="panel">

            <div class="panel-title">

                <div>
                    <small>
                        EL MANS INVENTORY
                    </small>

                    <h2>
                        المنتجات
                    </h2>
                </div>

            </div>


            <div class="products-toolbar">

                <input
                    class="search"
                    id="searchInput"
                    type="text"
                    placeholder="ابحث عن منتج..."
                    oninput="renderProducts()">

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                الصورة
                            </th>

                                المنتج
                            </th>

                            <th>
                                التصنيف
                            </th>

                            </th>

                            <th>

</section>


<div
    class="toast"
    id="toast">
</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let products = [];

let editingId = null;


/* =========================================
   ELEMENTS
========================================= */

const loginScreen =
    document.getElementById("loginScreen");

const adminScreen =
    document.getElementById("adminScreen");

const loginError =
    document.getElementById("loginError");


/* =========================================
   TOAST
========================================= */

function showToast(message,type="success"){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.className =
        "toast show " +
        (
            type === "error"
            ? "error-toast"
            : "success"
        );

    setTimeout(()=>{
        toast.classList.remove("show");
    },3000);

}


/* =========================================
   AUTH CHECK
========================================= */

async function checkSession(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        showLogin();

        return;
    }

    if(data.session){

        showAdmin();

    }else{

        showLogin();

    }

}


/* =========================================
   LOGIN
========================================= */

async function login(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    loginError.textContent = "";

    if(!email || !password){

        loginError.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        return;
    }

    const button =
        document.querySelector(".login-btn");

    button.disabled = true;

    button.textContent =
        "جاري تسجيل الدخول...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });


    button.disabled = false;

    button.textContent =
        "دخول لوحة التحكم";


    if(error){

        console.error(error);

        loginError.textContent =
            "بيانات الدخول غير صحيحة أو الحساب غير متاح.";

        return;
    }


    if(data.session){

        showAdmin();

    }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    products = [];

    showLogin();

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

    loginScreen.style.display =
        "flex";

    adminScreen.style.display =
        "none";

}


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(){

    loginScreen.style.display =
        "none";

    adminScreen.style.display =
        "block";

    loadProducts();

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const table =
        document.getElementById("productsTable");

    table.innerHTML = `
        <tr>
            <td colspan="5" style="text-align:center;padding:40px;">
                جاري تحميل المنتجات...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order("id",{ascending:false});


    if(error){

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;color:#ff7777;padding:40px;">
                    حدث خطأ أثناء تحميل المنتجات.
                </td>
            </tr>
        `;

        showToast(
            "تعذر تحميل المنتجات",
            "error"
        );

        return;
    }


    products =
        data || [];


    updateStats();

    renderProducts();

}


/* =========================================
   STATS
========================================= */

function updateStats(){

    document.getElementById("totalProducts")
        .textContent =
        products.length;

    document.getElementById("visibleProducts")
        .textContent =
        products.length;

}


/* =========================================
   RENDER
========================================= */

function renderProducts(){

    const table =
        document.getElementById("productsTable");

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        products.filter(product=>{

            const name =
                String(product.name || "")
                    .toLowerCase();

            const category =
                String(product.category_name || "")
                    .toLowerCase();

            return (
                !search ||
                name.includes(search) ||
                category.includes(search)
            );

        });


    if(filtered.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty">
                        <strong>
                            لا توجد منتجات
                        </strong>
                        <span>
                            أضف أول منتج من النموذج بالأعلى.
                        </span>
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        filtered.map(product=>{

            const image =
                product.image || "";


            return `

                <tr>

                    <td>

                        ${
                            image
                            ?
                            `
                            <img
                                class="product-thumb"
                                src="${escapeHtml(image)}"
                                alt="">
                            `
                            :
                            `
                            <div
                                class="product-thumb"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    color:#555;
                                ">
                                —
                            </div>
                            `
                        }

                    </td>


                    <td>
                        ${escapeHtml(product.name || "بدون اسم")}
                    </td>


                    <td>
                        ${escapeHtml(product.category_name || product.category || "—")}
                    </td>


                    <td>
                        <strong style="color:#D4AF37;">
                            ${Number(product.price || 0).toLocaleString("ar-EG")}
                            جنيه
                        </strong>
                    </td>


                    <td>

                        <button
                            class="action-btn"
                            onclick="editProduct(${product.id})">

                            تعديل

                        </button>


                        <button
                            class="action-btn delete"
                            onclick="deleteProduct(${product.id})">

                            حذف

                        </button>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

    const name =
        document
            .getElementById("productName")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("productPrice")
                .value
        );

    const category =
        document
            .getElementById("productCategory")
            .value;

    const categoryName =
        document
            .getElementById("productCategoryName")
            .value
            .trim();

    const image =
        document
            .getElementById("productImage")
            .value
            .trim();

    const description =
        document
            .getElementById("productDescription")
            .value
            .trim();


    if(!name){

        showToast(
            "اكتب اسم المنتج",
            "error"
        );

        return;
    }


    if(!Number.isFinite(price) || price < 0){

        showToast(
            "اكتب سعر صحيح",
            "error"
        );

        return;
    }


    if(!category){

        showToast(
            "اختار التصنيف",
            "error"
        );

        return;
    }


    const payload = {

        name:name,

        category:category,

        category_name:
            categoryName || category,

        price:price,

        description:
            description,

        image:
            image

    };


    const button =
        document.getElementById("saveBtn");

    button.disabled = true;

    button.textContent =
        editingId
        ? "جاري الحفظ..."
        : "جاري الإضافة...";


    let result;


    if(editingId){

        result =
            await supabaseClient
                .from("elmansstore23")
                .update(payload)
                .eq("id",editingId);

    }else{

        result =
            await supabaseClient
                .from("elmansstore23")
                .insert([payload]);

    }


    button.disabled = false;

    button.textContent =
        editingId
        ? "حفظ التعديل"
        : "إضافة المنتج";


    if(result.error){

        console.error(result.error);

        showToast(
            "حدث خطأ: " +
            result.error.message,
            "error"
        );

        return;
    }


    showToast(
        editingId
        ? "تم تعديل المنتج بنجاح ✓"
        : "تم إضافة المنتج بنجاح ✓"
    );


    resetForm();

    await loadProducts();

}


/* =========================================
   EDIT
========================================= */

function editProduct(id){

    const product =
        products.find(
            item =>
                Number(item.id) === Number(id)
        );


    if(!product)
        return;


    editingId =
        product.id;


    document.getElementById("formTitle")
        .textContent =
        "تعديل المنتج";


    document.getElementById("productName")
        .value =
        product.name || "";


    document.getElementById("productPrice")
        .value =
        product.price || "";


    document.getElementById("productCategory")
        .value =
        product.category || "";


    document.getElementById("productCategoryName")
        .value =
        product.category_name || "";


    document.getElementById("productImage")
        .value =
        product.image || "";


    document.getElementById("productDescription")
        .value =
        product.description || "";


    document.getElementById("saveBtn")
        .textContent =
        "حفظ التعديل";


    document.getElementById("cancelEditBtn")
        .style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

    resetForm();

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

    editingId =
        null;


    document.getElementById("formTitle")
        .textContent =
        "إضافة منتج جديد";


    document.getElementById("saveBtn")
        .textContent =
        "إضافة المنتج";


    document.getElementById("cancelEditBtn")
        .style.display =
        "none";


    document.getElementById("productName")
        .value = "";


    document.getElementById("productPrice")
        .value = "";


    document.getElementById("productCategory")
        .value = "";


    document.getElementById("productCategoryName")
        .value = "";


    document.getElementById("productImage")
        .value = "";


    document.getElementById("productDescription")
        .value = "";

}


/* =========================================
   DELETE
========================================= */

async function deleteProduct(id){

    const product =
        products.find(
            item =>
                Number(item.id) === Number(id)
        );


    if(!product)
        return;


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف المنتج:\n\n" +
            (product.name || "هذا المنتج")
        );


    if(!confirmed)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("elmansstore23")
            .delete()
            .eq("id",id);


    if(error){

        console.error(error);

        showToast(
            "تعذر حذف المنتج",
            "error"
        );

        return;
    }


    showToast(
        "تم حذف المنتج ✓"
    );


    await loadProducts();

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}
