<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#030303;
    --black2:#080808;
    --card:#101010;
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --white:#f8f8f8;
    --gray:#888;
    --danger:#d85c5c;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(212,175,55,.08),transparent 35%),
        #030303;
    color:var(--white);
    font-family:"Cairo",sans-serif;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:"Cairo",sans-serif;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at center,rgba(212,175,55,.10),transparent 40%),
        #030303;
}

.login-box{
    width:100%;
    max-width:430px;
    padding:40px 30px;
    background:rgba(10,10,10,.95);
    border:1px solid rgba(212,175,55,.3);
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    text-align:center;
}

.login-logo{
    direction:ltr;
    font-family:"Playfair Display",serif;
    font-size:38px;
    letter-spacing:5px;
    font-weight:700;
}

.login-logo span{
    color:var(--gold);
}

.login-line{
    width:100px;
    height:1px;
    margin:18px auto;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

.login-title{
    color:#aaa;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:30px;
}

.login-group{
    text-align:right;
    margin-bottom:15px;
}

.login-group label{
    display:block;
    color:#999;
    font-size:11px;
    margin-bottom:7px;
}

.login-group input{
    width:100%;
    padding:14px;
    background:#050505;
    border:1px solid rgba(212,175,55,.18);
    color:white;
    outline:none;
}

.login-group input:focus{
    border-color:var(--gold);
}

.login-btn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:0;
    background:var(--gold);
    color:#000;
    font-weight:800;
    cursor:pointer;
}

.login-error{
    color:#ff7777;
    font-size:11px;
    margin-top:14px;
    min-height:18px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
}

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    height:75px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(3,3,3,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(212,175,55,.15);
}

.logo{
    direction:ltr;
    font-family:"Playfair Display",serif;
    font-size:25px;
    font-weight:700;
    letter-spacing:5px;
}

.logo span{
    color:var(--gold);
}

.admin-label{
    color:#777;
    font-size:10px;
    letter-spacing:3px;
}

.logout-btn{
    padding:9px 15px;
    border:1px solid rgba(212,175,55,.25);
    background:transparent;
    color:#aaa;
    cursor:pointer;
    font-size:10px;
}

.logout-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
}

/* =========================
   DASHBOARD
========================= */

.container{
    width:92%;
    max-width:1250px;
    margin:40px auto 80px;
}

.hero-admin{
    padding:40px;
    margin-bottom:25px;
    background:
        linear-gradient(
            135deg,
            rgba(212,175,55,.08),
            rgba(255,255,255,.015)
        );
    border:1px solid rgba(212,175,55,.18);
}

.hero-admin small{
    color:var(--gold);
    letter-spacing:5px;
    font-size:10px;
}

.hero-admin h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(35px,6vw,60px);
    margin:8px 0;
}

.hero-admin p{
    color:#777;
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    padding:22px;
    background:#0b0b0b;
    border:1px solid rgba(212,175,55,.12);
}

.stat small{
    color:#777;
    font-size:10px;
}

.stat strong{
    display:block;
    color:var(--gold);
    font-size:28px;
    margin-top:5px;
}

/* =========================
   LAYOUT
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:390px 1fr;
    gap:20px;
    align-items:start;
}

.card{
    background:#0b0b0b;
    border:1px solid rgba(212,175,55,.16);
    padding:25px;
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.card-title h2{
    font-family:"Playfair Display",serif;
    font-size:24px;
}

.card-title span{
    color:var(--gold);
    font-size:11px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:#999;
    font-size:11px;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    background:#050505;
    border:1px solid rgba(212,175,55,.17);
    color:white;
    outline:none;
    font-size:12px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--gold);
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.file-box{
    border:1px dashed rgba(212,175,55,.25);
    padding:14px;
    background:#050505;
}

.file-box input{
    border:0;
    padding:0;
}

.preview{
    width:100%;
    height:180px;
    margin-top:12px;
    object-fit:cover;
    display:none;
    border:1px solid rgba(212,175,55,.4);
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    background:var(--gold);
    color:#000;
    font-weight:800;
    cursor:pointer;
}

.main-btn:hover{
    background:var(--gold2);
}

.secondary-btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:1px solid rgba(212,175,55,.25);
    background:transparent;
    color:#aaa;
    cursor:pointer;
    display:none;
}

.status{
    margin-top:15px;
    padding:11px;
    text-align:center;
    font-size:11px;
    display:none;
}

.status.success{
    display:block;
    color:#7bd67b;
    background:#0d1d0d;
    border:1px solid #245c24;
}

.status.error{
    display:block;
    color:#ff7777;
    background:#1e0b0b;
    border:1px solid #612323;
}

/* =========================
   PRODUCTS
========================= */

.products-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.refresh-btn{
    padding:9px 14px;
    border:1px solid rgba(212,175,55,.25);
    background:transparent;
    color:var(--gold);
    cursor:pointer;
    font-size:10px;
}

.products-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.product-row{
    display:flex;
    align-items:center;
    gap:15px;
    padding:14px;
    background:#101010;
    border:1px solid rgba(212,175,55,.10);
    transition:.25s;
}

.product-row:hover{
    border-color:rgba(212,175,55,.35);
}

.product-img{
    width:78px;
    height:78px;
    object-fit:cover;
    background:#050505;
    flex:none;
}

.product-info{
    flex:1;
    min-width:0;
}

.product-info h3{
    font-size:14px;
    margin-bottom:4px;
}

.product-category{
    color:var(--gold);
    font-size:10px;
}

.product-price{
    color:#aaa;
    font-size:11px;
    margin-top:5px;
}

.product-actions{
    display:flex;
    gap:7px;
    flex:none;
}

.edit-btn,
.delete-btn{
    padding:8px 11px;
    cursor:pointer;
    font-size:10px;
}

.edit-btn{
    border:1px solid rgba(212,175,55,.35);
    background:transparent;
    color:var(--gold);
}

.delete-btn{
    border:1px solid rgba(216,92,92,.35);
    background:transparent;
    color:#d85c5c;
}

.edit-btn:hover{
    background:var(--gold);
    color:#000;
}

.delete-btn:hover{
    background:#d85c5c;
    color:#000;
}

.empty{
    padding:60px 20px;
    text-align:center;
    border:1px dashed rgba(212,175,55,.15);
    color:#666;
}

.empty strong{
    display:block;
    color:#aaa;
    margin-bottom:5px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .dashboard-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .topbar{
        padding:0 4%;
    }

    .admin-label{
        display:none;
    }

    .container{
        width:94%;
        margin-top:25px;
    }

    .hero-admin{
        padding:25px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
    }

    .product-row{
        align-items:flex-start;
    }

    .product-img{
        width:65px;
        height:65px;
    }

    .product-actions{
        flex-direction:column;
    }

    .edit-btn,
    .delete-btn{
        width:65px;
    }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="login-logo">
            EL <span>MANS</span>
        </div>

        <div class="login-line"></div>

        <div class="login-title">
            PRIVATE ADMINISTRATION
        </div>

        <div class="login-group">

            <label>
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="loginEmail"

        <div class="login-group">

        <div

        </div>

    </div>

</section>


<!-- =========================
     APP
========================= -->

<div id="app">

<header class="topbar">

    <div class="logo">
        EL <span>MANS</span>
    </div>

    <div class="admin-label">
        LUXURY ADMIN PANEL
    </div>

    <button
        class="logout-btn"
        onclick="logoutAdmin()">

        تسجيل الخروج

    </button>

</header>


<main class="container">

    <section class="hero-admin">

        <small>
            EL MANS CONTROL CENTER
        </small>

        <h1>
            لوحة <span style="color:#D4AF37;">التحكم</span>
        </h1>

        <p>
            إدارة المنتجات والصور والأسعار من مكان واحد.
        </p>

    </section>


    <section class="stats">

        <div class="stat">

            <small>
                إجمالي المنتجات
            </small>

            <strong id="totalProducts">
                0
            </strong>

        </div>

        <div class="stat">

            <small>
                المنتجات الظاهرة
            </small>

            <strong id="visibleProducts">
                0
            </strong>

        </div>

        <div class="stat">

            <small>
                حالة النظام
            </small>

            <strong style="font-size:18px;">
                ONLINE
            </strong>

        </div>

    </section>


    <section class="dashboard-grid">


        <!-- FORM -->

        <div class="card">

            <div class="card-title">

                <h2 id="formTitle">

                </h2>

                <span>

                </span>

            </div>

                    <option value="">

                    <option value="men-accessories">

                    <option value="women-accessories">

                    <option value="men-chains">

                    <option value="women-chains">

                    </option>

                    </option>

                    <option value="teddy">
                        دباديب
                    </option>

                    <option value="men-perfume">
                        برفانات رجالي
                    </option>

                    <option value="women-perfume">
                        برفانات حريمي
                    </option>

                    <option value="men-body-splash">
                        بادي سبلاش رجالي
                    </option>

                    <option value="women-body-splash">
                        بادي سبلاش حريمي
                    </option>

                    <option value="parties">
                        حفلات
                    </option>

                    <option value="watches">
                        ساعات

                    <option value="engagement">
                        دبل خطوبة
                    </option>

            </div>


            <div class="form-group">

                <label>
                    اسم التصنيف بالعربي
                </label>

            <div class="form-group">

                </label>

                <textarea

            </div>


            <div class="form-group">

                <label>
                    صورة المنتج
                </label>

                <div class="file-box">

                    <input

            </div>


            <button
                class="main-btn"

                onclick="saveProduct()">

                إضافة المنتج

            </button>


            <button
                class="secondary-btn"
                id="cancelEditButton"
                onclick="cancelEdit()">

                إلغاء التعديل

            <div
                class="status"
                id="status">
            </div>

        </div>


        <!-- PRODUCTS -->

        <div class="card">

            <div class="products-header">

                <div class="card-title" style="margin:0;">

                    <h2>
                        المنتجات

                    <span>
                        INVENTORY
                    </span>

                </div>

                <button
                    class="refresh-btn"
                    onclick="loadProducts()">

                    تحديث

                </button>

            </div>


            <div
                class="products-list"
                id="productsList">

                <div class="empty">

        </div>

    </section>

</main>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let products = [];
let editingId = null;


/* =========================================
   CATEGORY NAMES
========================================= */

const categoryNames = {

    "men-accessories":"اكسسوارات رجالي",
    "women-accessories":"اكسسوارات حريمي",
    "men-chains":"سلاسل رجالي",
    "women-chains":"سلاسل حريمي",
    "gifts":"هدايا",
    "teddy":"دباديب",
    "men-perfume":"برفانات رجالي",
    "women-perfume":"برفانات حريمي",
    "men-body-splash":"بادي سبلاش رجالي",
    "women-body-splash":"بادي سبلاش حريمي",
    "parties":"حفلات",
    "watches":"ساعات",
    "engagement":"دبل خطوبة"

};


/* =========================================
   STATUS
========================================= */

function showStatus(message,type){

    const box =
        document.getElementById("status");

    box.textContent =
        message;

    box.className =
        "status " + type;

}


/* =========================================
   LOGIN CHECK
========================================= */

async function checkSession(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();

    if(session){

        showApp();

    }else{

        showLogin();

    }

}


/* =========================================
   LOGIN
========================================= */

async function loginAdmin(){

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const errorBox =
        document
            .getElementById("loginError");

    const button =
        document
            .getElementById("loginButton");


    errorBox.textContent = "";


    if(!email || !password){

        errorBox.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "جاري تسجيل الدخول...";


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email:email,
                password:password
            });


    if(error){

        console.error(error);

        errorBox.textContent =
            "بيانات الدخول غير صحيحة.";

        button.disabled = false;

        button.textContent =
            "دخول لوحة التحكم";

        return;

    }


    if(data.session){

        showApp();

    }

}


/* =========================================
   LOGOUT
========================================= */

async function logoutAdmin(){

    await supabaseClient
        .auth
        .signOut();

    location.reload();

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

    document
        .getElementById("loginScreen")
        .style.display =
            "flex";

    document
        .getElementById("app")
        .style.display =
            "none";

}


/* =========================================
   SHOW APP
========================================= */

function showApp(){

    document
        .getElementById("loginScreen")
        .style.display =
            "none";

    document
        .getElementById("app")
        .style.display =
            "block";

    loadProducts();

}


/* =========================================
   IMAGE PREVIEW
========================================= */

document
    .getElementById("productImage")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];

            const preview =
                document
                    .getElementById("imagePreview");


            if(!file){

                preview.style.display =
                    "none";

                preview.src =
                    "";

                return;

            }


            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

        }
    );


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

    const name =
        document
            .getElementById("productName")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("productPrice")
                .value
        );

    const category =
        document
            .getElementById("productCategory")
            .value;

    const categoryName =
        document
            .getElementById("productCategoryName")
            .value
            .trim();

    const description =
        document
            .getElementById("productDescription")
            .value
            .trim();

    const file =
        document
            .getElementById("productImage")
            .files[0];

    const button =
        document
            .getElementById("saveButton");


    /* VALIDATION */

    if(!name){

        showStatus(
            "اكتب اسم المنتج.",
            "error"
        );

        return;

    }


    if(!price || price < 0){

        showStatus(
            "اكتب سعر صحيح.",
            "error"
        );

        return;

    }


    if(!category){

        showStatus(
            "اختار التصنيف.",
            "error"
        );

        return;

    }


    const finalCategoryName =
        categoryName ||
        categoryNames[category] ||
        "";


    button.disabled =
        true;


    try{


        /* =========================
           ADD
        ========================= */

        if(editingId === null){

            if(!file){

                throw new Error(
                    "اختار صورة المنتج."
                );

            }


            button.textContent =
                "جاري رفع الصورة...";


            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2,9) +
                "." +
                extension;


            const filePath =
                "products/" +
                fileName;


            const {
                error:uploadError
            } =
                await supabaseClient
                    .storage
                    .from("product-images")
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false
                        }
                    );


            if(uploadError){

                throw uploadError;

            }


            const {
                data:publicData
            } =
                supabaseClient
                    .storage
                    .from("product-images")
                    .getPublicUrl(
                        filePath
                    );


            const imageUrl =
                publicData.publicUrl;


            button.textContent =
                "جاري حفظ المنتج...";


            const {
                error
            } =
                await supabaseClient
                    .from("elmansstore23")
                    .insert({

                        name:name,

                        price:price,

                        category:category,

                        category_name:
                            finalCategoryName,

                        description:
                            description,

                        image:imageUrl

                    });


            if(error){

                await supabaseClient
                    .storage
                    .from("product-images")
                    .remove([
                        filePath
                    ]);

                throw error;

            }


            showStatus(
                "تم إضافة المنتج بنجاح ✅",
                "success"
            );

        }


        /* =========================
           EDIT
        ========================= */

        else{

            button.textContent =
                "جاري حفظ التعديل...";


            const oldProduct =
                products.find(
                    p =>
                        Number(p.id) ===
                        Number(editingId)
                );


            let imageUrl =
                oldProduct
                    ? oldProduct.image
                    : "";


            if(file){

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,9) +
                    "." +
                    extension;


                const filePath =
                    "products/" +
                    fileName;


                const {
                    error:uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("product-images")
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl:"3600",
                                upsert:false
                            }
                        );


                if(uploadError){

                    throw uploadError;

                }


                const {
                    data:publicData
                } =
                    supabaseClient
                        .storage
                        .from("product-images")
                        .getPublicUrl(
                            filePath
                        );


                imageUrl =
                    publicData.publicUrl;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("elmansstore23")
                    .update({

                        name:name,

                        price:price,

                        category:category,

                        category_name:
                            finalCategoryName,

                        description:
                            description,

                        image:imageUrl

                    })
                    .eq(
                        "id",
                        editingId
                    );


            if(error){

                throw error;

            }


            showStatus(
                "تم تعديل المنتج بنجاح ✅",
                "success"
            );

        }


        resetForm();

        await loadProducts();


    }catch(error){

        console.error(error);

        showStatus(
            "حصل خطأ: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            editingId === null
            ? "إضافة المنتج"
            : "حفظ التعديل";

    }

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const container =
        document
            .getElementById("productsList");

    container.innerHTML =
        `<div class="empty">
            جاري تحميل المنتجات...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order(
                "id",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                <strong>تعذر تحميل المنتجات</strong>
                تأكد من صلاحيات Supabase.
            </div>`;

        return;

    }


    products =
        data || [];


    document
        .getElementById("totalProducts")
        .textContent =
            products.length;


    document
        .getElementById("visibleProducts")
        .textContent =
            products.length;


    renderProducts();

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

    const container =
        document
            .getElementById("productsList");


    if(products.length === 0){

        container.innerHTML =
            `<div class="empty">

                <strong>
                    لا توجد منتجات
                </strong>

                أضف أول منتج من النموذج.

            </div>`;

        return;

    }


    container.innerHTML =
        products
            .map(product=>{

                const image =
                    product.image || "";

                const name =
                    product.name ||
                    "بدون اسم";

                const category =
                    product.category_name ||
                    categoryNames[
                        product.category
                    ] ||
                    product.category ||
                    "";

                const price =
                    Number(
                        product.price || 0
                    )
                    .toLocaleString("ar-EG");


                return `

                    <div class="product-row">

                        <img
                            class="product-img"
                            src="${escapeHtml(image)}"
                            alt=""
                            onerror="this.style.opacity='.2';">

                        <div class="product-info">

                            <h3>
                                ${escapeHtml(name)}
                            </h3>

                            <div class="product-category">
                                ${escapeHtml(category)}
                            </div>

                            <div class="product-price">
                                ${price} جنيه
                            </div>

                        </div>

                        <div class="product-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct(${Number(product.id)})">

                                تعديل

                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProduct(${Number(product.id)})">

                                حذف

                            </button>

                        </div>

                    </div>

                `;

            })
            .join("");

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(id){

    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if(!product)
        return;


    editingId =
        Number(id);


    document
        .getElementById("formTitle")
        .textContent =
            "تعديل المنتج";


    document
        .getElementById("saveButton")
        .textContent =
            "حفظ التعديل";


    document
        .getElementById("cancelEditButton")
        .style.display =
            "block";


    document
        .getElementById("productName")
        .value =
            product.name || "";


    document
        .getElementById("productPrice")
        .value =
            product.price || "";


    document
        .getElementById("productCategory")
        .value =
            product.category || "";


    document
        .getElementById("productCategoryName")
        .value =
            product.category_name ||
            categoryNames[
                product.category
            ] ||
            "";


    document
        .getElementById("productDescription")
        .value =
            product.description || "";


    const preview =
        document
            .getElementById("imagePreview");


    if(product.image){

        preview.src =
            product.image;

        preview.style.display =
            "block";

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit(){

    resetForm();

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

    editingId =
        null;


    document
        .getElementById("formTitle")
        .textContent =
            "إضافة منتج";


    document
        .getElementById("saveButton")
        .textContent =
            "إضافة المنتج";


    document
        .getElementById("cancelEditButton")
        .style.display =
            "none";


    document
        .getElementById("productName")
        .value =
            "";


    document
        .getElementById("productPrice")
        .value =
            "";


    document
        .getElementById("productCategory")
        .value =
            "";


    document
        .getElementById("productCategoryName")
        .value =
            "";


    document
        .getElementById("productDescription")
        .value =
            "";


    document
        .getElementById("productImage")
        .value =
            "";


    const preview =
        document
            .getElementById("imagePreview");


    preview.src =
        "";

    preview.style.display =
        "none";


    document
        .getElementById("status")
        .className =
            "status";


    document
        .getElementById("status")
        .textContent =
            "";

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if(!product)
        return;


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف المنتج؟\n\n" +
            (
                product.name ||
                "هذا المنتج"
            )
        );


    if(!confirmed)
        return;


    try{

        const {
            error
        } =
            await supabaseClient
                .from("elmansstore23")
                .delete()
                .eq(
                    "id",
                    id
                );


        if(error){

            throw error;

        }


        if(
            editingId !== null &&
            Number(editingId) === Number(id)
        ){

            resetForm();

        }


        await loadProducts();


        showStatus(
            "تم حذف المنتج بنجاح.",
            "success"
        );


    }catch(error){

        console.error(error);

        showStatus(
            "تعذر حذف المنتج: " +
            (
                error.message ||
                "خطأ غير معروف"
            ),
            "error"
        );

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        (event,session)=>{

            if(session){

                showApp();

            }else{

                showLogin();

            }

        }
    );


/* =========================================
   START
========================================= */

checkSession();

</script>
