<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL MANS — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

:root{
    --gold:#D4AF37;
    --gold2:#F5DD87;
    --card:#101010;
    --border:rgba(212,175,55,.2);
    --gray:#999;
}

header{
    padding:20px 5%;
    background:#090909;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
}

.logo span{
    color:var(--gold);
}

header small{
    color:#777;
}

.container{
    width:92%;
    max-width:1250px;
    margin:35px auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.top h1{
    font-size:28px;
}

.top h1 span{
    color:var(--gold);
}

button{
    cursor:pointer;
    font-family:inherit;
}

.btn{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
    padding:11px 18px;
    font-weight:bold;
}

.btn.gold{
    background:var(--gold);
    color:#000;
}

.btn:hover{
    background:var(--gold2);
    color:#000;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    padding:22px;
}

.stat small{
    color:#777;
}

.stat strong{
    display:block;
    color:var(--gold);
    font-size:30px;
    margin-top:8px;
}

.panel{
    background:var(--card);
    border:1px solid var(--border);
    padding:25px;
    margin-bottom:25px;
}

.panel h2{
    margin-bottom:20px;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.group.full{
    grid-column:1/-1;
}

label{
    color:#aaa;
    font-size:13px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    background:#050505;
    color:#fff;
    border:1px solid rgba(212,175,55,.2);
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--gold);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.products-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.search{
    max-width:300px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    color:var(--gold);
    text-align:right;
    background:#080808;
}

th,td{
    padding:13px 10px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

td{
    color:#bbb;
    font-size:13px;
}

.product-img{
    width:60px;
    height:60px;
    object-fit:cover;
    background:#050505;
    border:1px solid var(--border);
}

.actions{
    display:flex;
    gap:7px;
}

.edit{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
    padding:7px 12px;
}

.delete{
    border:1px solid #733;
    background:transparent;
    color:#ff7777;
    padding:7px 12px;
}

.status{
    padding:12px;
    margin-bottom:20px;
    display:none;
    border:1px solid var(--border);
}

.status.show{
    display:block;
}

.status.success{
    color:#8ee28e;
    background:#081008;
}

.status.error{
    color:#ff8585;
    background:#100505;
}

.empty{
    text-align:center;
    padding:50px;
    color:#666;
}

@media(max-width:700px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .group.full{
        grid-column:auto;
    }

    .top{
        align-items:flex-start;
        flex-direction:column;
    }

    .products-head{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        max-width:none;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        EL <span>MANS</span>
    </div>

    <small>
        لوحة تحكم المتجر
    </small>

</header>


<div class="container">

    <div class="top">

        <h1>
            إدارة <span>المنتجات</span>
        </h1>

        <button class="btn" onclick="loadProducts()">
            تحديث المنتجات
        </button>

    </div>


    <div id="status" class="status"></div>


    <div class="dashboard">

        <div class="stat">
            <small>إجمالي المنتجات</small>
            <strong id="totalProducts">0</strong>
        </div>

        <div class="stat">
            <small>المنتجات المعروضة</small>
            <strong id="visibleProducts">0</strong>
        </div>

        <div class="stat">
            <small>حالة الاتصال</small>
            <strong id="connectionStatus">...</strong>
        </div>

    </div>


    <div class="panel">

        <h2 id="formTitle">
            إضافة منتج جديد
        </h2>

        <input type="hidden" id="productId">

        <div class="form-grid">

            <div class="group">

                <label>
                    اسم المنتج
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="مثال: سلسلة ذهبية">

            </div>


            <div class="group">

                <label>
                    السعر بالجنيه
                </label>

                <input
                    type="number"
                    id="productPrice"
                    placeholder="مثال: 750"
                    min="0"
                    step="0.01">

            </div>


            <div class="group">

                <label>
                    التصنيف
                </label>

                <select id="productCategory">

                    <option value="men-accessories">
                        اكسسورات رجالي
                    </option>

                    <option value="women-accessories">
                        اكسسورات حريمي
                    </option>

                    <option value="men-chains">
                        سلاسل رجالي
                    </option>

                    <option value="women-chains">
                        سلاسل حريمي
                    </option>

                    <option value="gifts">
                        هدايا
                    </option>

                    <option value="teddy">
                        دباديب
                    </option>

                    <option value="men-perfume">
                        برفانات رجالي
                    </option>

                    <option value="women-perfume">
                        برفانات حريمي
                    </option>

                    <option value="men-body-splash">
                        بادي سبلاش رجالي
                    </option>

                    <option value="women-body-splash">
                        بادي سبلاش حريمي
                    </option>

                    <option value="parties">
                        حفلات
                    </option>

                    <option value="watches">
                        ساعات
                    </option>

                    <option value="engagement">
                        دبل خطوبة
                    </option>

                </select>

            </div>


            <div class="group">

                <label>
                    اسم التصنيف بالعربي
                </label>

                <input
                    type="text"
                    id="categoryName"
                    placeholder="مثال: سلاسل رجالي">

            </div>


            <div class="group full">

                <label>
                    رابط صورة المنتج
                </label>

                <input
                    type="text"
                    id="productImage"
                    placeholder="ضع رابط الصورة هنا">

            </div>


            <div class="group full">

                <label>
                    وصف المنتج
                </label>

                <textarea
                    id="productDescription"
                    placeholder="اكتب وصف المنتج..."></textarea>

            </div>

        </div>


        <div class="form-buttons">

            <button
                class="btn gold"
                id="saveButton"
                onclick="saveProduct()">

                إضافة المنتج

            </button>

            <button
                class="btn"
                id="cancelButton"
                onclick="resetForm()"
                style="display:none;">

                إلغاء التعديل

            </button>

        </div>

    </div>


    <div class="panel">

        <div class="products-head">

            <h2>
                المنتجات
            </h2>

            <input
                class="search"
                type="text"
                id="searchInput"
                placeholder="ابحث عن منتج..."
                oninput="searchProducts()">

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>الصورة</th>
                        <th>الاسم</th>
                        <th>التصنيف</th>
                        <th>السعر</th>
                        <th>الوصف</th>
                        <th>الإجراء</th>

                    </tr>

                </thead>

                <tbody id="productsTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bwqtsedackwpyllbtdxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rawo0SzFw9jUUsjTvEoFJA_mnXpW8ab";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let products = [];

let editingId = null;


/* =========================================
   STATUS
========================================= */

function showStatus(message,type="success"){

    const box =
        document.getElementById("status");

    box.textContent = message;

    box.className =
        "status show " + type;

    setTimeout(()=>{

        box.classList.remove("show");

    },4000);

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    document.getElementById("connectionStatus")
        .textContent = "...";

    const {data,error} =
        await supabaseClient
            .from("elmansstore23")
            .select("*")
            .order("id",{ascending:true});


    if(error){

        console.error(error);

        document.getElementById("connectionStatus")
            .textContent = "خطأ";

        showStatus(
            "حصلت مشكلة في تحميل المنتجات: " +
            error.message,
            "error"
        );

        return;
    }


    products = data || [];


    document.getElementById("connectionStatus")
        .textContent = "متصل";


    document.getElementById("totalProducts")
        .textContent = products.length;


    renderProducts(products);

}


/* =========================================
   RENDER
========================================= */

function renderProducts(list){

    const table =
        document.getElementById("productsTable");


    document.getElementById("visibleProducts")
        .textContent = list.length;


    if(list.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    لا توجد منتجات حاليًا
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        list.map(product=>`

            <tr>

                <td>

                    ${
                        product.image
                        ?
                        `<img
                            class="product-img"
                            src="${escapeHtml(product.image)}"
                            alt="">`
                        :
                        `<div class="product-img"></div>`
                    }

                </td>


                <td>
                    ${escapeHtml(product.name)}
                </td>


                <td>
                    ${escapeHtml(product.category_name)}
                </td>


                <td>
                    ${Number(product.price || 0).toLocaleString("ar-EG")}
                    جنيه
                </td>


                <td>
                    ${escapeHtml(product.description)}
                </td>


                <td>

                    <div class="actions">

                        <button
                            class="edit"
                            onclick="editProduct(${product.id})">

                            تعديل

                        </button>


                        <button
                            class="delete"
                            onclick="deleteProduct(${product.id})">

                            حذف

                        </button>

                    </div>

                </td>

            </tr>

        `).join("");

}


/* =========================================
   SEARCH
========================================= */

function searchProducts(){

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if(!search){

        renderProducts(products);

        return;
    }


    const filtered =
        products.filter(product=>{

            return (

                String(product.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(product.category_name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                String(product.description || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    renderProducts(filtered);

}


/* =========================================
   SAVE
========================================= */

async function saveProduct(){

    const name =
        document.getElementById("productName")
            .value.trim();


    const price =
        document.getElementById("productPrice")
            .value;


    const category =
        document.getElementById("productCategory")
            .value;


    const categoryName =
        document.getElementById("categoryName")
            .value.trim();


    const image =
        document.getElementById("productImage")
            .value.trim();


    const description =
        document.getElementById("productDescription")
            .value.trim();


    if(!name){

        showStatus(
            "اكتب اسم المنتج الأول.",
            "error"
        );

        return;
    }


    if(price === "" || Number(price) < 0){

        showStatus(
            "اكتب سعر صحيح للمنتج.",
            "error"
        );

        return;
    }


    if(!categoryName){

        showStatus(
            "اكتب اسم التصنيف بالعربي.",
            "error"
        );

        return;
    }


    const productData = {

        name:name,

        category:category,

        category_name:categoryName,

        price:Number(price),

        description:description,

        image:image || null

    };


    const button =
        document.getElementById("saveButton");


    button.disabled = true;

    button.textContent = "جاري الحفظ...";


    let result;


    if(editingId){

        result =
            await supabaseClient
                .from("elmansstore23")
                .update(productData)
                .eq("id",editingId);

    }else{

        result =
            await supabaseClient
                .from("elmansstore23")
                .insert([productData]);

    }


    button.disabled = false;

    button.textContent =
        editingId
        ? "حفظ التعديل"
        : "إضافة المنتج";


    if(result.error){

        console.error(result.error);

        showStatus(
            "فشل الحفظ: " +
            result.error.message,
            "error"
        );

        return;
    }


    showStatus(
        editingId
        ? "تم تعديل المنتج بنجاح."
        : "تم إضافة المنتج بنجاح."
    );


    resetForm();

    await loadProducts();

}


/* =========================================
   EDIT
========================================= */

function editProduct(id){

    const product =
        products.find(
            item => Number(item.id) === Number(id)
        );


    if(!product)
        return;


    editingId = product.id;


    document.getElementById("productId")
        .value = product.id;


    document.getElementById("productName")
        .value = product.name || "";


    document.getElementById("productPrice")
        .value = product.price || "";


    document.getElementById("productCategory")
        .value = product.category || "men-accessories";


    document.getElementById("categoryName")
        .value = product.category_name || "";


    document.getElementById("productImage")
        .value = product.image || "";


    document.getElementById("productDescription")
        .value = product.description || "";


    document.getElementById("formTitle")
        .textContent = "تعديل المنتج";


    document.getElementById("saveButton")
        .textContent = "حفظ التعديل";


    document.getElementById("cancelButton")
        .style.display = "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   DELETE
========================================= */

async function deleteProduct(id){

    const product =
        products.find(
            item => Number(item.id) === Number(id)
        );


    if(!product)
        return;


    const confirmed =
        confirm(
            "هل أنت متأكد من حذف المنتج:\n\n" +
            product.name
        );


    if(!confirmed)
        return;


    const {error} =
        await supabaseClient
            .from("elmansstore23")
            .delete()
            .eq("id",id);


    if(error){

        console.error(error);

        showStatus(
            "فشل حذف المنتج: " +
            error.message,
            "error"
        );

        return;
    }


    showStatus(
        "تم حذف المنتج بنجاح."
    );


    await loadProducts();

}


/* =========================================
   RESET
========================================= */

function resetForm(){

    editingId = null;


    document.getElementById("productId")
        .value = "";


    document.getElementById("productName")
        .value = "";


    document.getElementById("productPrice")
        .value = "";


    document.getElementById("productCategory")
        .value = "men-accessories";


    document.getElementById("categoryName")
        .value = "";


    document.getElementById("productImage")
        .value = "";


    document.getElementById("productDescription")
        .value = "";


    document.getElementById("formTitle")
        .textContent = "إضافة منتج جديد";


    document.getElementById("saveButton")
        .textContent = "إضافة المنتج";


    document.getElementById("cancelButton")
        .style.display = "none";

}


/* =========================================
   START
========================================= */

loadProducts();

</script>

</body>
</html>
